<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع الملفات - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(135deg,#0f172a,#111827,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:450px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
padding:25px;
box-shadow:0 25px 60px rgba(0,0,0,.4);
}

h2{
text-align:center;
margin-bottom:20px;
font-size:22px;
font-weight:800;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:12px;
border:none;
outline:none;
background:rgba(255,255,255,.08);
color:white;
font-size:14px;
}

input::placeholder{
color:#cbd5e1;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#FFD700,#ffb300);
font-weight:800;
cursor:pointer;
font-size:15px;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.bar{
width:100%;
height:10px;
background:rgba(255,255,255,.1);
border-radius:20px;
overflow:hidden;
margin-top:10px;
display:none;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#16a34a);
transition:.2s;
}

#msg{
margin-top:12px;
text-align:center;
font-weight:700;
min-height:20px;
}

.debug{
font-size:11px;
opacity:.6;
margin-top:8px;
text-align:center;
}

</style>
</head>

<body>

<div class="card">

<h2>📤 رفع ملف / فيديو</h2>

<input id="title" placeholder="عنوان الملف *">
<input id="desc" placeholder="الوصف (اختياري)">

<select id="class_group">
  <option value="first_science">أولى ثانوي</option>
  <option value="third_biology">تالتة أحياء</option>
  <option value="third_geology">تالتة جيولوجيا</option>
</select>

<select id="type">
  <option value="file">ملف</option>
  <option value="video">فيديو</option>
</select>

<input type="file" id="file">

<div class="bar" id="bar">
  <div class="progress" id="progress"></div>
</div>

<button id="btn" onclick="upload()">🚀 رفع الملف</button>

<div id="msg"></div>
<div class="debug" id="debug"></div>

</div>

<script>
const client = window.supabase.createClient(
"https://nhdowqzecpwmkunczodl.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo"
);

window.upload = async function () {

const title = document.getElementById("title").value.trim();
const desc = document.getElementById("desc").value.trim();
const class_group = document.getElementById("class_group").value;
const type = document.getElementById("type").value;
const file = document.getElementById("file").files[0];

const msg = document.getElementById("msg");

if(!file){
msg.innerText = "❌ اختار ملف";
return;
}

msg.innerText = "⏳ جاري الرفع...";

try{

const fileName = Date.now() + "-" + file.name;
const path = type === "video"
? "videos/" + fileName
: "files/" + fileName;

const { data, error } = await client.storage
.from("study-files")
.upload(path, file);

if(error){
console.log(error);
msg.innerText = "❌ فشل الرفع";
return;
}

const { data: urlData } = client.storage
.from("study-files")
.getPublicUrl(data.path);

const { error: dbError } = await client
.from("study_files")
.insert({
title,
description: desc || null,
file_url: urlData.publicUrl,
class_group
});

if(dbError){
console.log(dbError);
msg.innerText = "❌ تم الرفع لكن فشل الحفظ";
return;
}

msg.innerText = "✅ تم الرفع بنجاح";

}catch(err){
console.log(err);
msg.innerText = "❌ خطأ غير متوقع";
}

};
</script>

</body>
</html>
