<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع الملفات - احترافي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(135deg,#0f172a,#111827,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:460px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
padding:25px;
box-shadow:0 25px 60px rgba(0,0,0,.5);
}

h2{text-align:center;margin-bottom:20px;font-weight:800;}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:12px;
border:none;
outline:none;
background:rgba(255,255,255,.08);
color:white;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#FFD700,#ffb300);
font-weight:800;
cursor:pointer;
}

button:disabled{opacity:.6;cursor:not-allowed;}

.bar{
width:100%;
height:10px;
background:rgba(255,255,255,.1);
border-radius:20px;
overflow:hidden;
margin-top:10px;
display:none;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#16a34a);
}

#msg{
text-align:center;
margin-top:10px;
font-weight:700;
}

/* Premium responsive file management — CSS only */
body{padding:18px;background:radial-gradient(ellipse at 12% 5%,rgba(118,100,223,.16),transparent 34%),linear-gradient(135deg,#080b1b,#11152f 55%,#090d20)}
.card{width:min(100%,460px);background:linear-gradient(145deg,rgba(27,32,67,.92),rgba(14,18,42,.94));border-color:rgba(174,160,255,.2);box-shadow:0 28px 80px rgba(0,0,0,.38)}
h2{color:#f4d77e}
input,select{border:1px solid rgba(174,160,255,.16);background:rgba(7,10,29,.58);min-width:0}
input:focus,select:focus{border-color:#9d8dff;box-shadow:0 0 0 3px rgba(118,100,223,.13)}
button{background:linear-gradient(120deg,#8270ed,#6551c9 52%,#5140aa);color:white;box-shadow:0 10px 24px rgba(81,64,170,.24)}
@media(max-width:520px){body{padding:12px;align-items:flex-start}.card{width:100%;max-width:460px;margin:auto;padding:20px 16px;border-radius:18px}input,select{font-size:16px}}
</style>
</head>

<body>

<div class="card">

<h2>📤 رفع ملف / فيديو</h2>

<input id="title" placeholder="عنوان الملف *">
<input id="desc" placeholder="الوصف (اختياري)">

<select id="class_group">
  <option value="first_science">أولى ثانوي</option>
  <option value="third_biology">تالتة أحياء</option>
  <option value="third_geology">تالتة جيولوجيا</option>
</select>

<select id="type">
  <option value="file">ملف</option>
  <option value="video">فيديو</option>
</select>

<input type="file" id="file">

<div class="bar" id="bar">
  <div class="progress" id="progress"></div>
</div>

<button id="btn" onclick="upload()">🚀 رفع الملف</button>

<div id="msg"></div>

</div>

<script>

/* ================= SUPABASE ================= */
const client = window.supabase.createClient(
"https://nhdowqzecpwmkunczodl.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo"
);

/* ================= CLEAN FILE NAME ================= */
function cleanFileName(name){
  return name
    .replace(/[\u0600-\u06FF]/g, "")
    .replace(/\s+/g, "_")
    .replace(/[^a-zA-Z0-9._-]/g, "");
}

/* ================= PROGRESS ================= */
function setProgress(v){
  document.getElementById("bar").style.display = "block";
  document.getElementById("progress").style.width = v + "%";
}

/* ================= AUTH FIX (IMPORTANT) ================= */
async function getUserSafe(){
  const { data: { session } } = await client.auth.getSession();
  return session?.user || null;
}

/* ================= MAIN UPLOAD ================= */
window.upload = async function(){

const title = document.getElementById("title").value.trim();
const desc = document.getElementById("desc").value.trim();
const class_group = document.getElementById("class_group").value;
const type = document.getElementById("type").value;
const file = document.getElementById("file").files[0];

const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

/* ================= VALIDATION ================= */
if(!title){
msg.innerText = "❌ اكتب عنوان";
return;
}

if(!file){
msg.innerText = "❌ اختار ملف";
return;
}

/* ================= CHECK USER (FIXED) ================= */
const user = await getUserSafe();

if(!user){
msg.innerText = "❌ لازم تسجل دخول الأول";
return;
}

/* ================= UI ================= */
btn.disabled = true;
btn.innerText = "⏳ جاري الرفع...";
msg.innerText = "جاري رفع الملف...";

try{

const fileName = Date.now() + "-" + cleanFileName(file.name);

const path = type === "video"
  ? "videos/" + fileName
  : "files/" + fileName;

setProgress(20);

/* ================= UPLOAD ================= */
const { data, error } = await client.storage
.from("study-files")
.upload(path, file);

if(error){
console.log(error);
msg.innerText = "❌ فشل رفع الملف (راجع RLS)";
btn.disabled = false;
btn.innerText = "🚀 رفع الملف";
return;
}

setProgress(70);

/* ================= PUBLIC URL ================= */
const { data: urlData } = client.storage
.from("study-files")
.getPublicUrl(data.path);

setProgress(85);

/* ================= DB SAVE ================= */
const { error: dbError } = await client
.from("study_files")
.insert([{
  title,
  description: desc || null,
  file_url: urlData.publicUrl,
  file_path: data.path,
  class_group,
  user_id: user.id
}]);

if(dbError){
console.log(dbError);
msg.innerText = "❌ تم الرفع لكن فشل الحفظ";
btn.disabled = false;
btn.innerText = "🚀 رفع الملف";
return;
}

setProgress(100);

msg.innerText = "✅ تم الرفع بنجاح";

setTimeout(()=>{
btn.disabled = false;
btn.innerText = "🚀 رفع الملف";
msg.innerText = "";
setProgress(0);
},2000);

}catch(err){
console.log(err);
msg.innerText = "❌ خطأ غير متوقع";
btn.disabled = false;
btn.innerText = "🚀 رفع الملف";
}

};

</script>

</body>
</html>
