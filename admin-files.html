<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الملفات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#020617);
color:white;
min-height:100vh;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
}

.sidebar h2{
color:#FFD700;
margin-bottom:20px;
}

.menu a{
display:block;
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:10px;
color:white;
text-decoration:none;
transition:.3s;
}

.menu a:hover{
background:#2563eb;
}

/* MAIN */
.main{
flex:1;
padding:20px;
overflow:auto;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
transition:.3s;
}

.btn-primary{
background:#FFD700;
color:#111;
}

.btn-danger{
background:#ef4444;
color:white;
}

/* FORM */
.form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
background:rgba(255,255,255,.05);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

input,select{
padding:10px;
border-radius:10px;
border:none;
outline:none;
background:rgba(255,255,255,.08);
color:white;
}

/* CARDS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
}

.card{
background:rgba(255,255,255,.05);
padding:15px;
border-radius:15px;
border:1px solid rgba(255,255,255,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
color:#FFD700;
margin-bottom:8px;
}

.meta{
font-size:13px;
opacity:.8;
margin-bottom:10px;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:10px;
}

.actions button{
padding:6px 10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.delete{
background:#ef4444;
color:white;
}

.link{
color:#60a5fa;
font-size:13px;
word-break:break-all;
}

@media(max-width:768px){
.sidebar{display:none;}
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>📁 الملفات</h2>

<div class="menu">
<a href="admin.html">🏠 الرئيسية</a>
<a href="admin-files.html">📁 الملفات</a>
<a href="admin-analytics.html">📊 التحليلات</a>
</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h2>إدارة الملفات</h2>
<button class="btn btn-danger" onclick="logout()">تسجيل خروج</button>
</div>

<!-- FORM -->
<div class="form">
<input id="title" placeholder="عنوان الملف">
<input id="desc" placeholder="الوصف">
<input id="url" placeholder="رابط الملف">
<select id="class_group">
<option value="first_science">أولى ثانوي</option>
<option value="third_biology">تالتة أحياء</option>
<option value="third_geology">تالتة جيولوجيا</option>
</select>

<button class="btn btn-primary" onclick="addFile()">رفع الملف</button>
</div>

<!-- GRID -->
<div class="grid" id="filesGrid"></div>

</div>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let files = [];

/* LOAD FILES */
async function loadFiles(){
const { data } = await client
.from("study_files")
.select("*")
.order("created_at",{ascending:false});

files = data || [];
render();
}

/* RENDER */
function render(){
const grid = document.getElementById("filesGrid");

grid.innerHTML = files.map(f => `
<div class="card">
<h3>${f.title}</h3>
<div class="meta">${f.description || ""}</div>

<div class="meta">📚 ${f.class_group}</div>

<a class="link" href="${f.file_url}" target="_blank">فتح الملف</a>

<div class="actions">
<button class="delete" onclick="deleteFile('${f.id}')">حذف</button>
</div>
</div>
`).join("");
}

/* ADD FILE */
async function addFile(){

const title = document.getElementById("title").value;
const desc = document.getElementById("desc").value;
const url = document.getElementById("url").value;
const class_group = document.getElementById("class_group").value;

if(!title || !url){
alert("اكتب العنوان والرابط");
return;
}

await client.from("study_files").insert([{
title,
description:desc,
file_url:url,
class_group
}]);

loadFiles();
}

/* DELETE */
async function deleteFile(id){
await client.from("study_files").delete().eq("id",id);
loadFiles();
}

/* LOGOUT */
function logout(){
localStorage.removeItem("user");
window.location.href="login.html";
}

loadFiles();

</script>

</body>
</html>
