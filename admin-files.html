<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع الملفات والفيديوهات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Cairo;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:420px;
background:#111827;
padding:20px;
border-radius:15px;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#FFD700;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>رفع ملف / فيديو</h2>

<input id="title" placeholder="عنوان">
<input id="desc" placeholder="وصف">

<select id="class_group">
  <option value="first_science">أولى ثانوي</option>
  <option value="third_biology">تالتة أحياء</option>
  <option value="third_geology">تالتة جيولوجيا</option>
</select>

<select id="type">
  <option value="file">ملف</option>
  <option value="video">فيديو</option>
</select>

<input type="file" id="file">

<button onclick="upload()">رفع</button>

<p id="msg"></p>

</div>

<script>
const supabase = window.supabase.createClient(
"https://nhdowqzecpwmkunczodl.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo"
);

async function upload(){

const title = document.getElementById("title").value;
const desc = document.getElementById("desc").value;
const class_group = document.getElementById("class_group").value;
const type = document.getElementById("type").value;
const file = document.getElementById("file").files[0];

const msg = document.getElementById("msg");

if(!file){
msg.innerText = "اختار ملف";
return;
}

msg.innerText = "جاري الرفع...";

try{

// 1️⃣ رفع الملف على Storage
const fileName = `${Date.now()}-${file.name}`;

const bucket = type === "video" ? "study-files" : "study-files";

const { data, error } = await supabase.storage
.from(bucket)
.upload(type === "video" ? `videos/${fileName}` : `files/${fileName}`, file);

if(error){
msg.innerText = "خطأ في رفع الملف";
return;
}

// 2️⃣ الحصول على الرابط
const { data: urlData } = supabase.storage
.from(bucket)
.getPublicUrl(data.path);

const file_url = urlData.publicUrl;

// 3️⃣ حفظ في الجدول
const { error: dbError } = await supabase
.from("study_files")
.insert({
title,
description: desc,
file_url,
class_group
});

if(dbError){
msg.innerText = "تم الرفع لكن فشل الحفظ";
return;
}

msg.innerText = "تم الرفع بنجاح ✅";

}catch(err){
console.log(err);
msg.innerText = "خطأ غير متوقع";
}

}
</script>

</body>
</html>
