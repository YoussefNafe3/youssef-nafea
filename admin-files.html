<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الملفات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= GLOBAL ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#020617);
color:white;
min-height:100vh;
display:flex;
overflow:hidden;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:260px;
background:rgba(255,255,255,.04);
backdrop-filter:blur(20px);
border-left:1px solid rgba(255,255,255,.08);
padding:20px;
}

.sidebar h2{
color:#FFD700;
margin-bottom:20px;
}

.menu a{
display:block;
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:10px;
color:white;
text-decoration:none;
transition:.3s;
}

.menu a:hover{
background:#2563eb;
transform:translateX(-3px);
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
overflow-y:auto;
height:100vh;
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
transition:.3s;
}

.btn-danger{
background:#ef4444;
color:white;
}

/* ================= CONTROL PANEL ================= */
.panel{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
background:rgba(255,255,255,.05);
padding:15px;
border-radius:15px;
margin-bottom:15px;
backdrop-filter:blur(10px);
}

input,select{
padding:10px;
border-radius:10px;
border:none;
outline:none;
background:rgba(255,255,255,.08);
color:white;
}

button.primary{
background:#FFD700;
color:#111;
border:none;
border-radius:10px;
font-weight:800;
cursor:pointer;
}

/* ================= SEARCH ================= */
.search{
margin-bottom:15px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
background:rgba(255,255,255,.05);
border:none;
color:white;
}

/* ================= GRID ================= */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
gap:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.08);
border-radius:15px;
padding:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
color:#FFD700;
margin-bottom:8px;
}

.meta{
font-size:13px;
opacity:.8;
margin-bottom:6px;
}

.link{
color:#60a5fa;
font-size:13px;
word-break:break-all;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:10px;
}

.delete{
background:#ef4444;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.preview{
background:#2563eb;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
.sidebar{display:none;}
body{overflow:auto;}
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>📁 الملفات</h2>

<div class="menu">
<a href="admin.html">🏠 الرئيسية</a>
<a href="admin-files.html">📁 الملفات</a>
<a href="admin-analytics.html">📊 التحليلات</a>
</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h2>📂 إدارة الملفات الاحترافية</h2>
<button class="btn btn-danger" onclick="logout()">تسجيل خروج</button>
</div>

<!-- CONTROL PANEL -->
<div class="panel">

<input id="title" placeholder="عنوان الملف">
<input id="desc" placeholder="الوصف">
<input id="url" placeholder="رابط الملف (PDF / Drive)">

<select id="class_group">
<option value="first_science">أولى ثانوي</option>
<option value="third_biology">تالتة أحياء</option>
<option value="third_geology">تالتة جيولوجيا</option>
</select>

<button class="primary" onclick="addFile()">➕ رفع الملف</button>

</div>

<!-- SEARCH -->
<div class="search">
<input id="search" placeholder="🔍 ابحث عن ملف..." oninput="render()">
</div>

<!-- GRID -->
<div class="grid" id="filesGrid"></div>

</div>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let files = [];

/* ================= LOAD ================= */
async function loadFiles(){
const { data } = await client
.from("study_files")
.select("*")
.order("created_at",{ascending:false});

files = data || [];
render();
}

/* ================= RENDER ================= */
function render(){

const search = document.getElementById("search").value?.toLowerCase() || "";

const grid = document.getElementById("filesGrid");

const filtered = files.filter(f =>
(f.title || "").toLowerCase().includes(search) ||
(f.description || "").toLowerCase().includes(search)
);

grid.innerHTML = filtered.map(f => `
<div class="card">

<h3>${f.title}</h3>

<div class="meta">${f.description || "-"}</div>
<div class="meta">📚 ${f.class_group}</div>

<a class="link" href="${f.file_url}" target="_blank">🔗 فتح الملف</a>

<div class="actions">
<button class="preview" onclick="window.open('${f.file_url}','_blank')">عرض</button>
<button class="delete" onclick="deleteFile('${f.id}')">حذف</button>
</div>

</div>
`).join("");
}

/* ================= ADD FILE ================= */
async function addFile(){

const title = document.getElementById("title").value;
const desc = document.getElementById("desc").value;
const url = document.getElementById("url").value;
const class_group = document.getElementById("class_group").value;

if(!title || !url){
alert("املأ العنوان والرابط");
return;
}

await client.from("study_files").insert([{
title,
description:desc,
file_url:url,
class_group
}]);

document.getElementById("title").value="";
document.getElementById("desc").value="";
document.getElementById("url").value="";

loadFiles();
}

/* ================= DELETE ================= */
async function deleteFile(id){
if(!confirm("هل تريد حذف الملف؟")) return;

await client.from("study_files").delete().eq("id",id);
loadFiles();
}

/* ================= LOGOUT ================= */
function logout(){
localStorage.removeItem("user");
window.location.href="login.html";
}

/* ================= INIT ================= */
loadFiles();

</script>

</body>
</html>
