<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إنشاء حساب</title>

<style>
body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
padding-top:60px;
}

input{
display:block;
margin:10px auto;
padding:12px;
width:260px;
border-radius:8px;
border:none;
text-align:right;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00c853;
color:white;
font-weight:bold;
}

#msg{
margin-top:15px;
}
</style>
</head>

<body>

<h2>إنشاء حساب</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم التليفون">
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="signup()">تسجيل</button>

<div id="msg"></div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

/* ================= INIT ================= */
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplcW...";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= VALIDATION ================= */
function validPhone(p){
return p.length === 11 && /^\d+$/.test(p);
}

/* ================= SIGNUP ================= */
window.signup = async function(){

const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const pass = document.getElementById("password").value;
const msg = document.getElementById("msg");

/* ================= LOADING ================= */
msg.innerText = "جاري إنشاء الحساب...";

/* ================= VALIDATION FIX ================= */

// الاسم
if(!name || name.trim() === ""){
msg.innerText = "من فضلك أدخل الاسم";
return;
}

// الرقم
if(!validPhone(phone)){
msg.innerText = "رقم التليفون غير صحيح";
return;
}

// الباسورد
if(!pass || pass.length < 6){
msg.innerText = "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
return;
}

/* ================= AUTH ================= */
const { error } = await client.auth.signUp({
email: phone + "@phone.com",
password: pass
});

/* ================= ERROR HANDLING ================= */
if(error){

if(error.message?.toLowerCase().includes("user already registered")){
msg.innerText = "تم تسجيل هذا الرقم من قبل";
}

else{
msg.innerText = "حدث خطأ أثناء إنشاء الحساب";
}

return;
}

/* ================= DB ================= */
const { error: dbErr } = await client
.from("students")
.insert([
{
full_name: name,
phone: phone,
role: "student",
activated: false
}
]);

if(dbErr){
msg.innerText = "حدث خطأ أثناء حفظ البيانات";
return;
}

msg.innerText = "تم إنشاء الحساب بنجاح 🎉";

}

</script>

</body>
</html>
