<style>

<body>

<h2>إنشاء حساب</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم التليفون">
<div class="password-box">
    <input id="password" type="password" placeholder="كلمة المرور">
    <span class="eye" onclick="togglePassword()">👁</span>
</div>
<button onclick="signup()">تسجيل</button>

<div id="msg"></div>

<!-- 1 ONLY SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* ================= INIT ================= */
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= VALIDATION ================= */
function validPhone(p){
return p.length === 11 && /^\d+$/.test(p);
}

/* ================= SIGNUP ================= */
window.signup = async function(){

const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const pass = document.getElementById("password").value;
const msg = document.getElementById("msg");

msg.innerText = "loading...";

// التحقق من الاسم
if(!name || name.trim().length < 3){
msg.innerText = "الرجاء إدخال اسم صحيح (3 أحرف على الأقل)";
return;
}

// التحقق من رقم التليفون
if(!validPhone(phone)){
msg.innerText = "رقم التليفون خطأ";
return;
}

// التحقق من كلمة المرور
if(!pass || pass.length < 6){
msg.innerText = "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
return;
}

/* AUTH */
const { error } = await client.auth.signUp({
email: phone + "@phone.com",
password: pass
});

if(error){

if(error.message?.toLowerCase().includes("user already registered")){
msg.innerText = "تم تسجيل هذا الرقم من قبل";
}

else{
msg.innerText = "حدث خطأ أثناء إنشاء الحساب";
}

return;
}

/* DB */
const { error: dbErr } = await client
.from("students")
.insert([
{
full_name: name,
phone: phone,
role: "student",
activated: false
}
]);

if(dbErr){
msg.innerText = dbErr.message;
return;
}

msg.innerText = "تم إنشاء الحساب بنجاح";

}
function togglePassword(){
const pass = document.getElementById("password");

if(pass.type === "password"){
pass.type = "text";
}else{
pass.type = "password";
}
}
</script>

</body>
</html>
