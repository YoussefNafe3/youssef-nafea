<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#111827,#020617);
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:30px 24px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
text-align:center;
font-size:60px;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:25px;
font-size:28px;
font-weight:800;
}

input, select{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
margin-bottom:15px;
}

select option{
color:black;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
left:15px;
top:18px;
cursor:pointer;
font-size:20px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#FFD700,#ffb300);
color:#111;
font-size:17px;
font-weight:800;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

#msg{
margin-top:15px;
text-align:center;
font-weight:700;
min-height:24px;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
color:#FFD700;
text-decoration:none;
font-weight:700;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🧬</div>

<h2>إنشاء حساب</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم التليفون">

<div class="password-box">
<input id="password" type="password" placeholder="كلمة المرور">
<span class="eye" onclick="togglePassword()">👁</span>
</div>

<!-- 🔥 إضافة الصفوف بدون تغيير الشكل الأساسي -->
<select id="class_group">
  <option value="first_science">أولى ثانوي (علوم متكاملة)</option>
  <option value="third_biology">تالتة ثانوي (أحياء)</option>
  <option value="third_geology">تالتة ثانوي (جيولوجيا)</option>
</select>

<button onclick="signup()">إنشاء الحساب</button>

<div id="msg"></div>

<div class="login-link">
لديك حساب بالفعل؟
<a href="login.html">تسجيل الدخول</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function validPhone(p){
return p.length === 11 && /^\d+$/.test(p);
}

function togglePassword(){
const pass = document.getElementById("password");
pass.type = pass.type === "password" ? "text" : "password";
}

window.signup = async function(){

const name = document.getElementById("name").value.trim();
const phone = document.getElementById("phone").value.trim();
const pass = document.getElementById("password").value;
const class_group = document.getElementById("class_group").value;
const msg = document.getElementById("msg");

msg.innerText = "جاري إنشاء الحساب...";

if(name.length < 3){
msg.innerText = "اسم غير صحيح";
return;
}

if(!validPhone(phone)){
msg.innerText = "رقم التليفون خطأ";
return;
}

if(pass.length < 6){
msg.innerText = "كلمة المرور ضعيفة";
return;
}

try {

/* ===== AUTH ===== */
const { data, error } = await client.auth.signUp({
  email: "user" + phone + "@gmail.com",
  password: pass
});

if(error){
  console.log(error);
  msg.innerText = "فشل إنشاء الحساب";
  return;
}

/* ===== SAVE STUDENT ===== */
const userId = data?.user?.id;

const { error: dbErr } = await client.from("students").insert([{
  full_name: name,
  phone: phone,
  class_group: class_group,  // 🔥 أهم إضافة
  role: "student",
  created_at: new Date().toISOString()
}]);

if(dbErr){
  console.log(dbErr);
  msg.innerText = "تم إنشاء الحساب لكن فشل حفظ البيانات";
  return;
}

msg.innerText = "تم إنشاء الحساب بنجاح 🎉";

} catch(err){
console.log(err);
msg.innerText = "حدث خطأ غير متوقع";
}

};

</script>

</body>
</html>
