<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#111827,#020617);
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:30px 24px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
text-align:center;
font-size:60px;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:25px;
font-size:28px;
font-weight:800;
}

input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
margin-bottom:15px;
}

input::placeholder{
color:#cbd5e1;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
left:15px;
top:18px;
cursor:pointer;
font-size:20px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#FFD700,#ffb300);
color:#111;
font-size:17px;
font-weight:800;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

#msg{
margin-top:15px;
text-align:center;
font-weight:700;
min-height:24px;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
color:#FFD700;
text-decoration:none;
font-weight:700;
}

.home-btn{
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 10px 14px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  color: #e5e7eb;
  text-decoration: none;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  backdrop-filter: blur(10px);
  transition: .3s;
}

.home-btn:hover{
  background: #2563eb;
  border-color: #2563eb;
  transform: translateY(-2px);
}

body{background:radial-gradient(ellipse at 15% 10%,rgba(118,100,223,.22),transparent 38%),linear-gradient(135deg,#080b1b,#11152f 52%,#090d20)}
.container{border:1px solid rgba(174,160,255,.22);background:linear-gradient(145deg,rgba(27,32,67,.96),rgba(14,18,42,.96));box-shadow:0 28px 90px rgba(0,0,0,.42)}
input,select#class_group{border:1px solid rgba(177,183,214,.17);background:rgba(7,10,29,.58)}
input:focus,select#class_group:focus{outline:none;border-color:#9d8dff;box-shadow:0 0 0 4px rgba(118,100,223,.15)}
button{background:linear-gradient(120deg,#8270ed,#6551c9 52%,#5140aa);color:white;box-shadow:0 12px 25px rgba(81,64,170,.3)}
.login-link a{color:#d3caff}

/* Animated premium DNA mark */
.logo{display:flex;align-items:center;justify-content:center;margin:0 auto 14px;width:88px;height:88px;border-radius:27px;border:1px solid rgba(174,160,255,.27);background:radial-gradient(circle at 50% 42%,rgba(118,100,223,.22),rgba(244,215,126,.045) 72%);box-shadow:0 12px 34px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.dna-mark{display:block;width:65px;height:65px;overflow:visible;filter:drop-shadow(0 0 9px rgba(118,100,223,.2));transform-origin:center;animation:dna-float 4s ease-in-out infinite}
.dna-core{transform-origin:center;animation:dna-turn 6s ease-in-out infinite}
.dna-strand{stroke-dasharray:180;stroke-dashoffset:0;animation:dna-flow 3.6s linear infinite}
.strand-b{animation-delay:-1.8s}
.dna-rungs path{transform-box:fill-box;transform-origin:center;animation:dna-rung 2.4s ease-in-out infinite}
.dna-rungs path:nth-child(even){animation-delay:-1.2s}
@keyframes dna-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.035)}}
@keyframes dna-turn{0%,100%{transform:rotateY(0deg) rotateZ(-3deg)}50%{transform:rotateY(22deg) rotateZ(3deg)}}
@keyframes dna-flow{to{stroke-dashoffset:-360}}
@keyframes dna-rung{0%,100%{transform:scaleX(.65);opacity:.48}50%{transform:scaleX(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.dna-mark,.dna-core,.dna-strand,.dna-rungs path{animation:none!important}}

</style>

</head>

<body>
<a href="index.html" class="home-btn">
  ← العودة للصفحة الرئيسية
</a>
<div class="container">

<div class="logo"><svg class="dna-mark" viewBox="0 0 100 100" role="img" aria-label="DNA" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="dnaViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5baff"/><stop offset="1" stop-color="#7664df"/></linearGradient>
  <linearGradient id="dnaGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b2"/><stop offset="1" stop-color="#d5a83e"/></linearGradient>
  <filter id="dnaGlow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <g class="dna-core" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path class="dna-strand strand-a" d="M27 10 C76 20 76 30 27 40 C-1 50 -1 60 27 70 C76 80 76 90 27 96" stroke="url(#dnaViolet)" stroke-width="5.5" filter="url(#dnaGlow)"/>
  <path class="dna-strand strand-b" d="M73 10 C24 20 24 30 73 40 C101 50 101 60 73 70 C24 80 24 90 73 96" stroke="url(#dnaGold)" stroke-width="5.5" filter="url(#dnaGlow)"/>
  <g class="dna-rungs" stroke="#d8d1ff" stroke-width="3.3" opacity=".9">
   <path d="M35 15 L65 15"/><path d="M48 25 L52 25"/><path d="M35 35 L65 35"/>
   <path d="M15 45 L85 45"/><path d="M15 55 L85 55"/><path d="M35 65 L65 65"/>
   <path d="M48 75 L52 75"/><path d="M35 85 L65 85"/>
  </g>
 </g>
 <circle cx="27" cy="10" r="3" fill="#e5deff"/><circle cx="73" cy="96" r="3" fill="#ffe7a0"/>
</svg></div>

<h2>إنشاء حساب</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم التليفون">

<div class="password-box">
<input id="password" type="password" placeholder="كلمة المرور (احفظها كويس متنسهاش)">
<span class="eye" onclick="togglePassword()">👁</span>
</div>

<!-- 🔥 الصفوف (إضافة بدون تغيير الأساس) -->
<select id="class_group" style="
width:100%;
padding:15px;
border-radius:16px;
margin-bottom:15px;
background:rgba(255,255,255,.08);
color:white;
border:none;
outline:none;
">
  <option value="first_science">أولى ثانوي (علوم متكاملة)</option>
  <option value="third_biology">تالتة ثانوي (أحياء)</option>
  <option value="third_geology">تالتة ثانوي (جيولوجيا)</option>
</select>

<button onclick="signup()">إنشاء الحساب</button>

<div id="msg"></div>

<div class="login-link">
لديك حساب بالفعل؟
<a href="login.html">تسجيل الدخول</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
if(localStorage.getItem("user")){
  const user = JSON.parse(localStorage.getItem("user"));

  if(user.role === "admin"){
    window.location.replace("admin.html");
  }else{
    window.location.replace("dashboard.html");
  }
}

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function validPhone(p){
return p.length === 11 && /^\d+$/.test(p);
}

function togglePassword(){
const pass = document.getElementById("password");
pass.type = pass.type === "password" ? "text" : "password";
}

window.signup = async function(){

const name = document.getElementById("name").value.trim();
const phone = document.getElementById("phone").value.trim();
const pass = document.getElementById("password").value;
const class_group = document.getElementById("class_group").value;
const msg = document.getElementById("msg");

msg.innerText = "جاري إنشاء الحساب...";

try {

/* 1 - VALIDATION */
if(name.length < 3){
msg.innerText = "اكتب اسمك كامل وصحيح";
return;
}

if(!validPhone(phone)){
msg.innerText = "رقم التليفون خطأ";
return;
}

if(pass.length < 6){
msg.innerText = "كلمة المرور قصيرة";
return;
}

/* 2 - AUTH */
const { data, error } = await client.auth.signUp({
email: phone + "@phone.com",
password: pass
});

if(error){
console.log(error);
msg.innerText = "رقمك متسجل بيه حساب خلاص روح اعمل تسجيل دخول";
return;
}

/* 3 - SAVE DATABASE (بدون id نهائياً) */
const { error: dbErr } = await client.from("students").insert([{
full_name: name,
phone: phone,
class_group: class_group,
role: "student",
activated: false
}]);

if(dbErr){
console.log(dbErr);
msg.innerText = "تم إنشاء الحساب لكن فشل حفظ البيانات";
return;
}

msg.innerText = "تم إنشاء الحساب بنجاح 🎉";

} catch(err){
console.log(err);
msg.innerText = "حدث خطأ غير متوقع";
}

};

</script>


<script>
(function(){
 const message = document.getElementById("msg");
 if(!message) return;
 const observer = new MutationObserver(function(){
   if(message.textContent.includes("تم إنشاء الحساب بنجاح")){
     observer.disconnect();
     window.location.assign("login.html?registered=1");
   }
 });
 observer.observe(message, {childList:true,subtree:true,characterData:true});
})();
</script>
</body>
</html>
