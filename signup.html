<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إنشاء حساب</title>

<style>
body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
padding-top:60px;
}

input{
display:block;
margin:10px auto;
padding:12px;
width:250px;
border-radius:8px;
border:none;
text-align:right;
font-size:14px;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00c853;
color:white;
font-weight:bold;
}

button:hover{
transform:scale(1.05);
}

#msg{
margin-top:15px;
}
</style>
</head>

<body>

<h2>إنشاء حساب جديد</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم التليفون (11 رقم)">
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="signup()">تسجيل</button>

<div id="msg"></div>

<!-- Supabase CDN (صح 100%) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function isValidPhone(phone){
return phone.length === 11 && /^\d+$/.test(phone);
}

window.signup = async function(){

const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const password = document.getElementById("password").value;
const msg = document.getElementById("msg");

msg.innerText = "جاري...";

if(!isValidPhone(phone)){
msg.innerText = "رقم غير صحيح";
return;
}

const { error } = await supabase.auth.signUp({
email: phone + "@phone.com",
password
});

if(error){
msg.innerText = error.message;
return;
}

const { error: dbError } = await supabase
.from("students")
.insert([{ full_name: name, phone, role:"student", activated:false }]);

if(dbError){
msg.innerText = dbError.message;
return;
}

msg.innerText = "تم إنشاء الحساب";
}
</script>

</body>
</html>
