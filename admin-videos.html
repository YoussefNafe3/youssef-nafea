<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رفع الفيديوهات | الأدمن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:520px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

h2{
text-align:center;
margin-bottom:20px;
font-size:24px;
font-weight:800;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:800;
background:linear-gradient(135deg,#FFD700,#ffb300);
color:#111;
transition:.3s;
}

button:disabled{
opacity:0.6;
cursor:not-allowed;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:700;
min-height:20px;
}

.progress-container{
width:100%;
height:12px;
background:rgba(255,255,255,.1);
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#16a34a);
transition:0.1s;
}

.progress-text{
text-align:center;
margin-top:8px;
font-weight:700;
color:#FFD700;
}

.back{
margin-top:15px;
display:block;
text-align:center;
color:#93c5fd;
text-decoration:none;
font-weight:700;
}

.back:hover{
color:#FFD700;
}

</style>
</head>

<body>

<div class="container">

<h2>🎬 رفع فيديو جديد</h2>

<input id="title" placeholder="عنوان الفيديو">
<input type="file" id="file" accept="video/*">

<button id="uploadBtn" onclick="uploadVideo()">رفع الفيديو</button>

<div class="progress-container">
<div class="progress-bar" id="bar"></div>
</div>

<div class="progress-text" id="percent">0%</div>

<div id="msg"></div>

<a class="back" href="admin.html">⬅ الرجوع للوحة التحكم</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async () => {

const user = JSON.parse(localStorage.getItem("user"));

// ❌ مفيش user
if (!user) {
  window.location.href = "admin-login.html";
  return;
}

// 🌍 جلب IP الحالي
const ip = await fetch("https://api.ipify.org?format=json")
.then(r => r.json())
.then(d => d.ip);

// ❌ مش admin أو IP مختلف
if (user.role !== "admin" || user.ip !== ip) {
  window.location.href = "admin-login.html";
  return;
}


})();
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= ELEMENTS ================= */
const bar = document.getElementById("bar");
const percentText = document.getElementById("percent");
const msg = document.getElementById("msg");
const btn = document.getElementById("uploadBtn");

/* ================= ADMIN CHECK ================= */


/* ================= UPLOAD ================= */
async function uploadVideo(){

const title = document.getElementById("title").value;
const file = document.getElementById("file").files[0];

if(!title || !file){
msg.innerText = "⚠️ املأ البيانات أولاً";
return;
}

btn.disabled = true;
msg.innerText = "جاري الرفع...";

const fileName = Date.now() + "_" + file.name;

try{

/* ================= REAL UPLOAD ================= */
const xhr = new XMLHttpRequest();

xhr.open("POST",
`${SUPABASE_URL}/storage/v1/object/videos/${fileName}`
);

xhr.setRequestHeader("Authorization", `Bearer ${SUPABASE_ANON_KEY}`);
xhr.setRequestHeader("x-upsert", "false");

xhr.upload.onprogress = (e)=>{
if(e.lengthComputable){
const percent = Math.round((e.loaded / e.total) * 100);
bar.style.width = percent + "%";
percentText.innerText = percent + "%";
}
};

xhr.onload = async () => {

if(xhr.status !== 200){
msg.innerText = "❌ فشل رفع الفيديو";
btn.disabled = false;
return;
}

/* get public url */
const { data } = client.storage
.from("videos")
.getPublicUrl(fileName);

/* save in DB */
const { error } = await client
.from("videos")
.insert([{
title,
url: data.publicUrl,
is_premium: false,
created_at: new Date().toISOString()
}]);

if(error){
msg.innerText = "⚠️ تم الرفع لكن فشل الحفظ";
btn.disabled = false;
return;
}

msg.innerText = "✅ تم رفع الفيديو بنجاح";

setTimeout(()=>{
bar.style.width = "0%";
percentText.innerText = "0%";
btn.disabled = false;
document.getElementById("title").value = "";
document.getElementById("file").value = "";
},1200);

};

xhr.onerror = () => {
msg.innerText = "❌ خطأ في الاتصال";
btn.disabled = false;
};


xhr.send(file);

}catch(err){
console.log(err);
msg.innerText = "❌ حدث خطأ غير متوقع";
btn.disabled = false;
}

}

</script>

</body>
</html>
