<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رفع الفيديوهات | الأدمن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* CARD */
.container{
width:100%;
max-width:500px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

h2{
text-align:center;
margin-bottom:20px;
font-size:24px;
font-weight:800;
}

/* INPUTS */
input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
outline:none;
}

input::placeholder{
color:#cbd5e1;
}

/* FILE */
input[type="file"]{
padding:10px;
background:transparent;
}

/* BUTTON */
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:800;
background:linear-gradient(135deg,#FFD700,#ffb300);
color:#111;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

/* MSG */
#msg{
margin-top:15px;
text-align:center;
font-weight:700;
min-height:20px;
}

/* PROGRESS BAR */
.progress-box{
margin-top:15px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
height:12px;
}

.progress-bar{
height:100%;
width:0%;
background:#FFD700;
transition:0.2s;
}

#percent{
text-align:center;
margin-top:8px;
font-weight:700;
}

/* BACK */
.back{
margin-top:15px;
display:block;
text-align:center;
color:#93c5fd;
text-decoration:none;
font-weight:700;
}

.back:hover{
color:#FFD700;
}

</style>

</head>

<body>

<div class="container">

<h2>🎬 رفع فيديو جديد</h2>

<input id="title" placeholder="عنوان الفيديو">
<input type="file" id="file" accept="video/*">

<button onclick="uploadVideo()">رفع الفيديو</button>

<!-- PROGRESS -->
<div class="progress-box">
<div class="progress-bar" id="bar"></div>
</div>
<div id="percent">0%</div>

<div id="msg"></div>

<a class="back" href="admin.html">⬅ الرجوع للوحة التحكم</a>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function uploadVideo(){

const title = document.getElementById("title").value;
const file = document.getElementById("file").files[0];

const msg = document.getElementById("msg");
const bar = document.getElementById("bar");
const percentText = document.getElementById("percent");

if(!title || !file){
msg.innerText = "املأ البيانات أولاً";
return;
}

msg.innerText = "جاري الرفع... ⏳";

const fileName = Date.now() + "_" + file.name;

try {

/* PROGRESS SIMULATION (Reliable) */
let fakeProgress = 0;
const interval = setInterval(()=>{
fakeProgress += Math.random()*10;
if(fakeProgress >= 95) fakeProgress = 95;

bar.style.width = fakeProgress + "%";
percentText.innerText = Math.floor(fakeProgress) + "%";
},200);

/* UPLOAD */
const { error: uploadError } = await client.storage
.from("videos")
.upload(fileName, file);

clearInterval(interval);

if(uploadError){
msg.innerText = "فشل رفع الفيديو";
return;
}

bar.style.width = "100%";
percentText.innerText = "100%";

/* GET URL */
const { data: urlData } = client.storage
.from("videos")
.getPublicUrl(fileName);

const publicUrl = urlData.publicUrl;

/* SAVE DB */
const { error: dbError } = await client
.from("videos")
.insert([{
title: title,
url: publicUrl,
is_premium: false
}]);

if(dbError){
msg.innerText = "فشل حفظ البيانات";
return;
}

msg.innerText = "تم رفع الفيديو بنجاح ✅";

document.getElementById("title").value = "";
document.getElementById("file").value = "";

} catch(err){
console.log(err);
msg.innerText = "حدث خطأ غير متوقع";
}

}

</script>

</body>
</html>
