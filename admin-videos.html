<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رفع الفيديوهات | الأدمن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* ================= CARD ================= */
.container{
width:100%;
max-width:500px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

h2{
text-align:center;
margin-bottom:20px;
font-size:24px;
font-weight:800;
}

/* ================= INPUTS ================= */
input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
outline:none;
}

input::placeholder{
color:#cbd5e1;
}

/* ================= FILE ================= */
input[type="file"]{
padding:10px;
background:transparent;
}

/* ================= BUTTON ================= */
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:800;
background:linear-gradient(135deg,#FFD700,#ffb300);
color:#111;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

/* ================= MSG ================= */
#msg{
margin-top:15px;
text-align:center;
font-weight:700;
min-height:20px;
}

/* ================= BACK ================= */
.back{
margin-top:15px;
display:block;
text-align:center;
color:#93c5fd;
text-decoration:none;
font-weight:700;
}

.back:hover{
color:#FFD700;
}

</style>

</head>

<body>

<div class="container">

<h2>🎬 رفع فيديو جديد</h2>

<input id="title" placeholder="عنوان الفيديو">

<input type="file" id="file" accept="video/*">

<button onclick="uploadVideo()">رفع الفيديو</button>

<div id="msg"></div>

<a class="back" href="admin.html">⬅ الرجوع للوحة التحكم</a>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9....";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function uploadVideo(){

const title = document.getElementById("title").value;
const file = document.getElementById("file").files[0];
const msg = document.getElementById("msg");

if(!title || !file){
msg.innerText = "املأ البيانات أولاً";
return;
}

msg.innerText = "جاري الرفع... ⏳";

// اسم فريد للفيديو
const fileName = Date.now() + "_" + file.name;

// 1️⃣ رفع الفيديو في Storage
async function uploadVideo(){

const title = document.getElementById("title").value;
const file = document.getElementById("file").files[0];
const msg = document.getElementById("msg");

if(!title || !file){
msg.innerText = "املأ البيانات أولاً";
return;
}

msg.innerText = "جاري الرفع... ⏳";

const fileName = Date.now() + "_" + file.name;

/* 1️⃣ رفع الفيديو */
const { error: uploadError } = await client.storage
.from("videos")
.upload(fileName, file);

if(uploadError){
console.log(uploadError);
msg.innerText = "فشل رفع الفيديو";
return;
}

/* 2️⃣ جلب الرابط الصح */
const { data } = client.storage
.from("videos")
.getPublicUrl(fileName);

const publicUrl = data.publicUrl;

/* 3️⃣ حفظ في الداتابيز */
const { error: dbError } = await client
.from("videos")
.insert([{
title: title,
url: publicUrl
}]);

if(dbError){
console.log(dbError);
msg.innerText = "فشل حفظ البيانات";
return;
}

msg.innerText = "تم رفع الفيديو بنجاح ✅";

document.getElementById("title").value = "";
document.getElementById("file").value = "";
}

// 2️⃣ الحصول على الرابط
const { data } = client.storage
.from("videos")
.getPublicUrl(fileName);

// 3️⃣ حفظ في الجدول
const { error: dbError } = await client
.from("videos")
.insert([{
title: title,
url: data.publicUrl,
created_at: new Date()
}]);

if(dbError){
msg.innerText = "فشل حفظ البيانات";
return;
}

msg.innerText = "تم رفع الفيديو بنجاح ✅";

// reset
document.getElementById("title").value = "";
document.getElementById("file").value = "";

}

</script>

</body>
</html>
