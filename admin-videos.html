<style>

*{

    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    color:white;

    radial-gradient(circle at bottom left,rgba(245,158,11,.12),transparent 35%),

}

/* ================= CONTAINER ================= */

.container{

    width:100%;
    max-width:620px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.10);

    border-radius:28px;

    padding:30px;

    box-shadow:
    0 30px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

}

/* ================= HEADER ================= */

.header{

    text-align:center;

    margin-bottom:28px;

}

.header-icon{

    width:70px;
    height:70px;

    margin:0 auto 14px;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    background:linear-gradient(
        135deg,
        #facc15,
        #f59e0b

    color:#111827;

    box-shadow:
    0 15px 35px rgba(245,158,11,.22);

}

.header h1{

    font-size:25px;
    font-weight:800;

    margin-bottom:5px;

}

.header p{

    color:#94a3b8;
    font-size:14px;

}

/* ================= LABEL ================= */

.field{

    margin-bottom:18px;

}

label{

    display:block;

    margin-bottom:8px;

    font-size:14px;

    color:#cbd5e1;

    font-weight:700;

}

/* ================= INPUT ================= */

input,
select{

    width:100%;

    padding:14px 15px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.10);

    outline:none;

    background:rgba(15,23,42,.75);

    color:white;

    font-size:14px;

}

select:focus{

}

input::placeholder{

    color:#64748b;

}

select option{

    background:#111827;

}

/* ================= TYPE SELECTOR ================= */

.type-selector{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:20px;

}

.type-option{

    position:relative;

}

.type-option input{

    position:absolute;

    opacity:0;
    pointer-events:none;

}

.type-label{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    padding:15px;

    border-radius:15px;

    cursor:pointer;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.09);

    color:#cbd5e1;

    font-weight:700;

    transition:.25s;

}

.type-option input:checked + .type-label{

}

/* ================= SOURCE BOX ================= */

/* =========================================================
   YOUTUBE ID EXTRACTION
========================================================= */

function getYouTubeId(url){

    if(!url){
        return null;
    }

    try{

        const parsed =
        new URL(url.trim());

        const hostname =
        parsed.hostname
        .toLowerCase()
        .replace("www.","")
        .replace("m.","");

        /* youtube.com/watch?v= */
        if(
            hostname === "youtube.com" ||
            hostname === "youtube-nocookie.com"
        ){

            const id =
            parsed.searchParams.get("v");

            if(id){
                return id;
            }

            /* youtube.com/embed/VIDEO_ID */
            const embedMatch =
            parsed.pathname.match(
                /\/embed\/([^/?]+)/
            );

            if(embedMatch){
                return embedMatch[1];
            }

            /* youtube.com/shorts/VIDEO_ID */
            const shortsMatch =
            parsed.pathname.match(
                /\/shorts\/([^/?]+)/
            );

            if(shortsMatch){
                return shortsMatch[1];
            }

        }

        /* youtu.be/VIDEO_ID */

        if(hostname === "youtu.be"){

            const id =
            parsed.pathname
            .split("/")
            .filter(Boolean)[0];

            if(id){
                return id;
            }

        }

    }catch(error){

        return null;

    }

    return null;

}

        }


        const youtubeId =

            uploadBtn.disabled = false;

            youtubeInput.focus();

            return;
        }


        /*
          نحفظ رابط embed ثابت.
          صفحة الطالب ستتعرف عليه تلقائياً.
        */

        const embedUrl =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(youtubeId);


        showMessage(
            "جاري إضافة فيديو YouTube..."
        );

const { data: insertedVideo, error } = await client

  }])

if (error) {

}

console.log("VIDEO SAVED:", insertedVideo);

msg.innerText = "✅ تم رفع وحفظ الفيديو بنجاح";

    /* =================================================

    const file =

    if(!file){

    /* ================= UI ================= */
