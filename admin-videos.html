/* =========================================================
   ADMIN SECURITY CHECK
========================================================= */

async function checkAdmin(){

    let savedUser = null;

    try{

        savedUser =
            JSON.parse(
                localStorage.getItem("user")
            );

    }catch(error){

        savedUser = null;

    }

    if(!savedUser){

        window.location.href =
            "admin-login.html";

        return false;
    }

    if(savedUser.role !== "admin"){

        window.location.href =
            "admin-login.html";

        return false;
    }

    /*
       IP check retained from your old system.
       It is only an additional check and NOT a
       replacement for Supabase RLS.
    */

    try{

        const response =
            await fetch(
                "https://api.ipify.org?format=json",
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            savedUser.ip &&
            savedUser.ip !== data.ip
        ){

            window.location.href =
                "admin-login.html";

            return false;
        }

    }catch(error){

        /*
           Do not block the admin if the external
           IP service is temporarily unavailable.
        */

        console.warn(
            "IP verification unavailable."
        );

    }

    return true;
}


/* =========================================================
   YOUTUBE ID EXTRACTOR
========================================================= */

function extractYouTubeId(value){

    if(!value){
        return null;
    }

    const input =
        value.trim();

    let url;

    try{

        url = new URL(input);

    }catch(error){

        return null;

    }

    const hostname =
        url.hostname
            .toLowerCase()
            .replace(/^www\./,"");

    /*
       Standard:
       youtube.com/watch?v=ID
    */

    if(
        hostname === "youtube.com" ||
        hostname === "m.youtube.com"
    ){

        const watchId =
            url.searchParams.get("v");

        if(
            watchId &&
            /^[A-Za-z0-9_-]{11}$/.test(watchId)
        ){

            return watchId;

        }

        /*
           Shorts
        */

        const shortsMatch =
            url.pathname.match(
                /^\/shorts\/([A-Za-z0-9_-]{11})/
            );

        if(shortsMatch){

            return shortsMatch[1];

        }

        /*
           Embed
        */

        const embedMatch =
            url.pathname.match(
                /^\/embed\/([A-Za-z0-9_-]{11})/
            );

        if(embedMatch){

            return embedMatch[1];

        }

    }

    /*
       youtu.be/ID
    */

    if(hostname === "youtu.be"){

        const id =
            url.pathname
                .replace(/^\/+/,"")
                .split("/")[0];

        if(
            /^[A-Za-z0-9_-]{11}$/.test(id)
        ){

            return id;

        }

    }

    return null;
}

/* =========================================================
   PREVIEW YOUTUBE
========================================================= */

function updateYouTubePreview(){

    const id =
        extractYouTubeId(
            youtubeUrlInput.value
        );

    if(!id){

        youtubePreview.style.display =
            "none";

        previewFrame.src =

        return;
    }

    previewFrame.src =
        `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1`;

    youtubePreview.style.display =
        "block";
}

/* =========================================================
   UPLOAD FILE
========================================================= */

async function uploadLocalVideo(){

    const file =
        fileInput.files[0];

    if(!file){

        throw new Error(
            "اختر ملف الفيديو أولاً."
        );

    }

    if(!file.type.startsWith("video/")){

        throw new Error(
            "الملف المحدد ليس فيديو."
        );

    }

    const safeName =
        file.name
            .replace(/[^\w.\-() ]+/g,"")
            .replace(/\s+/g,"_")
            .substring(0,120);

    const fileName =
        `${Date.now()}_${crypto.randomUUID()}_${safeName}`;


    progressWrap.style.display =
        "block";

    progressBar.style.width =
        "0%";

    progressText.textContent =
        "0%";


    return new Promise(
        (resolve,reject)=>{

            const xhr =
                new XMLHttpRequest();

            xhr.open(
                "POST",
                `${SUPABASE_URL}/storage/v1/object/videos/${encodeURIComponent(fileName)}`
            );

            xhr.setRequestHeader(
                "Authorization",
                `Bearer ${SUPABASE_ANON_KEY}`
            );

            xhr.setRequestHeader(
                "apikey",
                SUPABASE_ANON_KEY
            );

            xhr.setRequestHeader(
                "x-upsert",
                "false"
            );

            xhr.setRequestHeader(
                "Content-Type",
                file.type || "application/octet-stream"
            );


            xhr.upload.onprogress =
                function(event){

                    if(!event.lengthComputable){
                        return;
                    }

                    const percent =
                        Math.round(
                            event.loaded /
                            event.total *
                            100
                        );

                    progressBar.style.width =
                        percent + "%";

                    progressText.textContent =
                        percent + "%";

                };


            xhr.onload =
                async function(){

                    if(
                        xhr.status < 200 ||
                        xhr.status >= 300
                    ){

                        reject(
                            new Error(
                                "فشل رفع الفيديو إلى Storage."
                            )
                        );

                        return;
                    }


                    const publicResult =
                        client.storage
                            .from("videos")
                            .getPublicUrl(fileName);


                    const publicUrl =
                        publicResult
                            ?.data
                            ?.publicUrl;


                    if(!publicUrl){

                        reject(
                            new Error(
                                "تعذر إنشاء رابط الفيديو."
                            )
                        );

                        return;
                    }


                    const {
                        error
                    } = await client
                        .from("videos")
                        .insert([{

                            title:
                                titleInput.value.trim(),

                            url:
                                publicUrl,

                            class_group:
                                classGroup.value,

                            is_premium:
                                false,

                            video_type:
                                "upload",

                            youtube_id:
                                null

                        }]);


                    if(error){

                        reject(error);

                        return;
                    }


                    resolve();

                };


            xhr.onerror =
                function(){

                    reject(
                        new Error(
                            "حدث خطأ في الاتصال أثناء الرفع."
                        )
                    );

                };


            xhr.send(file);

        }
    );

}


/* =========================================================

async function addYouTubeVideo(){

    const url =
        youtubeUrlInput.value.trim();

    const youtubeId =
        extractYouTubeId(url);

    if(!youtubeId){

        throw new Error(
            "رابط YouTube غير صحيح."
        );

    }


    /*
       We intentionally store ONLY the ID.
       The original URL is not saved.
    */

    const {
        error
    } = await client
        .from("videos")
        .insert([{

            title:
                titleInput.value.trim(),

            url:
                null,

            class_group:
                classGroup.value,

            is_premium:
                false,

            video_type:
                "youtube",

            youtube_id:
                youtubeId

        }]);


    if(error){

        throw error;

    }

}

            "";

        youtubeUrlInput.value =
            "";

        fileInput.value =
            "";

        youtubePreview.style.display =
            "none";
