<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081426"><title>الامتحانات الأونلاين | د. يوسف نافع</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#081426;--panel:#10213a;--line:rgba(148,182,224,.16);--text:#f2f6fc;--muted:#a4b5cb;--accent:#9b8afb}
html[data-theme=light]{color-scheme:light;--bg:#f3f7fc;--panel:#fff;--line:rgba(50,83,128,.14);--text:#172b45;--muted:#647792;--accent:#6553c7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at 10% 0%,rgba(59,130,246,.16),transparent 40%),linear-gradient(145deg,var(--bg),#0d1c32);font-family:Cairo,sans-serif;color:var(--text)}html[data-theme=light] body{background:radial-gradient(ellipse at 10% 0%,#e4efff,transparent 40%),linear-gradient(145deg,var(--bg),#eaf1fa)}
.card{width:min(100%,620px);padding:clamp(25px,5vw,48px);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.18)}
.icon{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 22px;border:1px solid rgba(155,138,251,.25);border-radius:22px;background:rgba(155,138,251,.1);color:var(--accent);font-size:35px}
h1{margin:0 0 12px;font-size:clamp(24px,5vw,34px);font-weight:900}p{margin:0 auto;color:var(--muted);font-size:14px;line-height:2;max-width:450px}
.badge{display:inline-flex;margin-top:22px;padding:7px 13px;border:1px solid var(--line);border-radius:99px;color:var(--accent);font-size:12px;font-weight:800;background:rgba(155,138,251,.07)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}button,a{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none;font-size:12px;font-weight:800;cursor:pointer}
.primary{background:#6553c7;border-color:#6553c7;color:white}.theme{position:fixed;top:16px;left:16px}
</style></head>
<body>
<button class="btn theme" id="themeToggle" type="button"><span id="themeIcon">☀</span><span id="themeLabel">الوضع الفاتح</span></button>
<main class="card">
<div class="icon" aria-hidden="true">✓</div>
<h1>الامتحانات الأونلاين</h1>
<p>هنا هتظهر الامتحانات المتاحة لك بمجرد نشرها من إدارة المنصة. تابع المنصة باستمرار واستعدّ لاختبار معلوماتك.</p>
<div class="badge">مساحتك للاختبار والتقييم</div>
<div class="actions"><a class="btn primary" href="dashboard.html">العودة إلى لوحة الطالب ←</a><a class="btn" href="results.html">عرض النتائج</a></div>
</main>
<script>
(function(){const root=document.documentElement,b=document.getElementById("themeToggle"),i=document.getElementById("themeIcon"),l=document.getElementById("themeLabel");function apply(t){const light=t==="light";root.dataset.theme=light?"light":"dark";i.textContent=light?"☾":"☀";l.textContent=light?"الوضع الداكن":"الوضع الفاتح";try{localStorage.setItem("student-dashboard-theme",t)}catch(e){}}let t="dark";try{t=localStorage.getItem("student-dashboard-theme")==="light"?"light":"dark"}catch(e){}apply(t);b.addEventListener("click",()=>apply(root.dataset.theme==="light"?"dark":"light"))})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</script>
</body></html>
