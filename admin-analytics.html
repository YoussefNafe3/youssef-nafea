<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analytics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo';
background:#0b1220;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#0f172a;
border-left:1px solid #1f2937;
padding:10px;
overflow-y:auto;
}

.student{
padding:10px;
margin-bottom:8px;
border-radius:10px;
background:rgba(255,255,255,0.04);
cursor:pointer;
transition:0.2s;
}

.student:hover{
background:#2563eb;
}

.student.active{
background:#2563eb;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TOP BAR */
.top{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0f172a;
border-bottom:1px solid #1f2937;
}

.title{
color:#FFD700;
font-weight:700;
}

/* CONTENT */
.content{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;
overflow:auto;
}

/* CARD */
.card{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:14px;
padding:12px;
}

.card h3{
margin:0 0 10px 0;
color:#FFD700;
}

/* VIDEO ITEM */
.video{
margin-bottom:10px;
padding:10px;
border-radius:10px;
background:rgba(255,255,255,0.03);
}

.bar{
height:8px;
background:#1f2937;
border-radius:20px;
overflow:hidden;
margin-top:5px;
}

.fill{
height:100%;
background:linear-gradient(90deg,#2563eb,#22c55e);
width:0%;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:15px;
}

.box{
background:rgba(255,255,255,0.04);
padding:10px;
border-radius:10px;
text-align:center;
}

.box h2{
margin:0;
color:#FFD700;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="studentsList"></div>

<!-- MAIN -->
<div class="main">

<div class="top">
<div class="title">📊 Analytics Dashboard</div>
</div>

<!-- STATS -->
<div class="stats">
<div class="box"><h2 id="totalStudents">0</h2><p>Students</p></div>
<div class="box"><h2 id="totalSessions">0</h2><p>Sessions</p></div>
<div class="box"><h2 id="avgPercent">0%</h2><p>Avg Watch</p></div>
</div>

<!-- CONTENT -->
<div class="content">

<div class="card">
<h3>👤 Student Details</h3>
<div id="studentInfo">اختر طالب</div>
</div>

<div class="card">
<h3>🎬 Videos Progress</h3>
<div id="videoProgress">---</div>
</div>

</div>

</div>

<script>

const supabase = window.supabase.createClient(
"https://nhdowqzecpwmkunczodl.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo"
);

let sessions = [];
let selectedStudent = null;

/* LOAD DATA */
async function load(){

const { data } = await supabase
.from("video_sessions")
.select("*");

sessions = data || [];

renderStudents();
renderStats();

if(!selectedStudent && sessions.length){
selectStudent(sessions[0].student_id);
}
}

/* GROUP BY STUDENT */
function getStudents(){
const map = {};

sessions.forEach(s=>{
if(!map[s.student_id]) map[s.student_id] = [];
map[s.student_id].push(s);
});

return map;
}

/* SIDEBAR */
function renderStudents(){

const students = getStudents();
const el = document.getElementById("studentsList");

el.innerHTML = Object.keys(students).map(id=>`
<div class="student ${id===selectedStudent?'active':''}" onclick="selectStudent('${id}')">
👤 ${id}
</div>
`).join("");

}

/* SELECT STUDENT */
window.selectStudent = function(id){
selectedStudent = id;
renderStudents();
renderStudentData();
}

/* STUDENT DATA */
function renderStudentData(){

const data = sessions.filter(s=>s.student_id===selectedStudent);

document.getElementById("studentInfo").innerHTML = `
<b>ID:</b> ${selectedStudent}<br>
<b>Sessions:</b> ${data.length}<br>
`;

/* group videos */
const videos = {};

data.forEach(s=>{
if(!videos[s.video_id]){
videos[s.video_id] = {total:0,count:0,skips:0};
}
videos[s.video_id].total += s.percent;
videos[s.video_id].count++;
videos[s.video_id].skips += (s.skips||0);
});

document.getElementById("videoProgress").innerHTML =
Object.keys(videos).map(v=>{

const d = videos[v];
const avg = d.total / d.count;

return `
<div class="video">
<div>🎬 ${v}</div>

<div class="bar">
<div class="fill" style="width:${avg}%"></div>
</div>

<small>
📊 ${avg.toFixed(1)}% | ⏩ ${d.skips}
</small>
</div>
`;

}).join("");

}

/* STATS */
function renderStats(){

document.getElementById("totalSessions").innerText = sessions.length;

const students = new Set(sessions.map(s=>s.student_id));
document.getElementById("totalStudents").innerText = students.size;

let avg = 0;
if(sessions.length){
avg = sessions.reduce((a,b)=>a+(b.percent||0),0)/sessions.length;
}

document.getElementById("avgPercent").innerText = avg.toFixed(1)+"%";
}

load();
setInterval(load,15000);

</script>

</body>
</html>
