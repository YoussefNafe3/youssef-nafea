<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحليلات | د. يوسف نافع</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Cairo;
background:#0f172a;
color:white;
}

.container{
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:#111827;
padding:15px;
border-radius:12px;
text-align:center;
}

.card h2{
margin:0;
font-size:20px;
color:#FFD700;
}

.card p{
font-size:18px;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #222;
text-align:center;
}

th{
background:#1f2937;
color:#FFD700;
}

.section{
margin-top:25px;
}

h3{
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 لوحة التحليلات</h1>

<div class="cards">

<div class="card">
<h2 id="students">0</h2>
<p>الطلاب</p>
</div>

<div class="card">
<h2 id="views">0</h2>
<p>المشاهدات</p>
</div>

<div class="card">
<h2 id="videos">0</h2>
<p>الفيديوهات</p>
</div>

<div class="card">
<h2 id="avg">0%</h2>
<p>متوسط الإكمال</p>
</div>

</div>

<!-- TOP STUDENTS -->
<div class="section">
<h3>🏆 أفضل الطلاب</h3>
<table>
<thead>
<tr>
<th>الطالب</th>
<th>الفيديوهات</th>
<th>متوسط %</th>
</tr>
</thead>
<tbody id="topStudents"></tbody>
</table>
</div>

<!-- VIDEO STATS -->
<div class="section">
<h3>🎬 الفيديوهات</h3>
<table>
<thead>
<tr>
<th>الفيديو</th>
<th>المشاهدات</th>
<th>متوسط الإكمال</th>
</tr>
</thead>
<tbody id="videoStats"></tbody>
</table>
</div>

<!-- SESSIONS -->
<div class="section">
<h3>📋 آخر الجلسات</h3>
<table>
<thead>
<tr>
<th>الطالب</th>
<th>الفيديو</th>
<th>%</th>
<th>الوقت</th>
</tr>
</thead>
<tbody id="sessions"></tbody>
</table>
</div>

</div>

<script>
const supabase = window.supabase.createClient(
"https://nhdowqzecpwmkunczodl.supabase.co",
"YOUR_ANON_KEY"
);

/* ================= LOAD DATA ================= */
async function load(){

// sessions
const { data: sessions } = await supabase
.from("video_sessions")
.select("*")
.order("id", { ascending:false })
.limit(50);

// videos
const { data: videos } = await supabase
.from("videos")
.select("*");

// 1️⃣ COUNTS
document.getElementById("videos").innerText = videos?.length || 0;
document.getElementById("views").innerText = sessions?.length || 0;

// students unique
const students = new Set(sessions?.map(s => s.student_id));
document.getElementById("students").innerText = students.size;

// avg completion
let avg = 0;
if(sessions?.length){
avg = sessions.reduce((a,b)=>a+b.percent,0)/sessions.length;
}
document.getElementById("avg").innerText = avg.toFixed(1)+"%";

/* ================= TOP STUDENTS ================= */
const studentMap = {};

sessions.forEach(s=>{
if(!studentMap[s.student_id]){
studentMap[s.student_id] = {count:0,total:0};
}
studentMap[s.student_id].count++;
studentMap[s.student_id].total += s.percent;
});

const top = Object.entries(studentMap)
.map(([id,val])=>({
id,
avg: val.total/val.count,
count: val.count
}))
.sort((a,b)=>b.avg-a.avg);

document.getElementById("topStudents").innerHTML =
top.map(s=>`
<tr>
<td>${s.id}</td>
<td>${s.count}</td>
<td>${s.avg.toFixed(1)}%</td>
</tr>
`).join("");

/* ================= VIDEO STATS ================= */
const videoMap = {};

sessions.forEach(s=>{
if(!videoMap[s.video_id]){
videoMap[s.video_id] = {count:0,total:0};
}
videoMap[s.video_id].count++;
videoMap[s.video_id].total += s.percent;
});

document.getElementById("videoStats").innerHTML =
Object.entries(videoMap).map(([id,v])=>`
<tr>
<td>${id}</td>
<td>${v.count}</td>
<td>${(v.total/v.count).toFixed(1)}%</td>
</tr>
`).join("");

/* ================= SESSIONS ================= */
document.getElementById("sessions").innerHTML =
sessions.map(s=>`
<tr>
<td>${s.student_id}</td>
<td>${s.video_id}</td>
<td>${s.percent.toFixed(1)}%</td>
<td>${new Date(s.updated_at).toLocaleString()}</td>
</tr>
`).join("");

}

load();
setInterval(load,20000);
</script>

</body>
</html>
