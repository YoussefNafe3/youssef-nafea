<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Analytics | Dr Youssef Nafea</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Cairo',sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-bottom:15px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}

th{
background:#1e293b;
color:#FFD700;
}

tr:hover{
background:#1e293b;
}

.bad{
color:#ff4d4d;
font-weight:bold;
}

.good{
color:#22c55e;
font-weight:bold;
}

.mid{
color:#facc15;
font-weight:bold;
}

.stats{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.card{
flex:1;
background:#111827;
padding:15px;
border-radius:12px;
text-align:center;
}

.card h2{
margin:0;
color:#FFD700;
}

.card p{
margin:5px 0 0;
}

</style>
</head>

<body>

<h1>📊 Video Analytics Dashboard</h1>

<input id="search" placeholder="🔍 Search by student ID or video ID">

<div class="stats">
<div class="card">
<h2 id="totalStudents">0</h2>
<p>Students</p>
</div>

<div class="card">
<h2 id="avgProgress">0%</h2>
<p>Avg Progress</p>
