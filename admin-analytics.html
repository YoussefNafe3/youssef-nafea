<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analytics Pro | د. يوسف نافع</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo';
background:linear-gradient(135deg,#0b1220,#0f172a,#111827);
color:white;
}

/* HEADER */
.header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#FFD700;
margin:0;
}

.search{
padding:10px;
border-radius:10px;
border:none;
width:250px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
padding:20px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;
padding:15px;
backdrop-filter: blur(10px);
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
background:rgba(37,99,235,0.15);
}

.card h3{
margin:0;
color:#FFD700;
}

.small{
font-size:12px;
opacity:0.7;
}

/* PROGRESS */
.bar{
height:10px;
background:#1f2937;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
background:linear-gradient(90deg,#2563eb,#22c55e);
width:0%;
}

/* SKIP BADGE */
.badge{
display:inline-block;
padding:4px 8px;
border-radius:8px;
font-size:12px;
margin-top:8px;
}

.badge.good{background:#16a34a;}
.badge.warn{background:#f59e0b;}
.badge.bad{background:#ef4444;}

</style>
</head>

<body>

<div class="header">
<h1>📊 Analytics Pro</h1>
<input class="search" id="search" placeholder="ابحث عن طالب..." />
</div>

<div class="grid" id="grid"></div>

<script>
const supabase = window.supabase.createClient(
"https://nhdowqzecpwmkunczodl.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo"
);

let sessions = [];

async function load(){

const { data } = await supabase
.from("video_sessions")
.select("*");

sessions = data || [];
render();
}

function render(){

const search = document.getElementById("search").value || "";

const grouped = {};

// grouping per student + video
sessions.forEach(s=>{

if(!grouped[s.student_id]){
grouped[s.student_id] = {};
}

if(!grouped[s.student_id][s.video_id]){
grouped[s.student_id][s.video_id] = {
total:0,
count:0,
skips:0
};
}

grouped[s.student_id][s.video_id].total += s.percent;
grouped[s.student_id][s.video_id].count++;
grouped[s.student_id][s.video_id].skips += (s.skips || 0);

});

let html = "";

Object.keys(grouped).forEach(student=>{

if(search && !student.includes(search)) return;

const videos = grouped[student];

let videoHTML = "";

Object.keys(videos).forEach(v=>{

const d = videos[v];
const avg = d.total / d.count;

let color = "good";
if(avg < 70) color = "warn";
if(avg < 40) color = "bad";

videoHTML += `
<div style="margin-top:10px">
<div class="small">🎬 ${v}</div>

<div class="bar">
<div class="fill" style="width:${avg}%"></div>
</div>

<div class="small">
📊 ${avg.toFixed(1)}% | ⏩ Skips: ${d.skips}
</div>

<span class="badge ${color}">
${avg > 80 ? "ممتاز" : avg > 50 ? "متوسط" : "ضعيف"}
</span>
</div>
`;
});

html += `
<div class="card">
<h3>👤 ${student}</h3>
${videoHTML}
</div>
`;
});

document.getElementById("grid").innerHTML = html;
}

document.getElementById("search").addEventListener("input",render);

load();
setInterval(load,15000);
</script>

</body>
</html>
