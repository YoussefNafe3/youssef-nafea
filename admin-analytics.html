<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Analytics | Dr Youssef Nafea</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
padding:20px;
}

h1{
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

.stats{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px;
}

.card{
flex:1;
background:#111827;
padding:15px;
border-radius:14px;
text-align:center;
}

.card h2{
margin:0;
color:#FFD700;
}

.table-wrap{
overflow:auto;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
min-width:900px;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}

th{
background:#1e293b;
color:#FFD700;
position:sticky;
top:0;
}

tr:hover{background:#1e293b;}

.bad{color:#ff4d4d;font-weight:bold;}
.good{color:#22c55e;font-weight:bold;}
.mid{color:#facc15;font-weight:bold;}

</style>
</head>

<body>

<h1>📊 Video Analytics Dashboard</h1>

<div class="stats">
<div class="card">
<h2 id="totalStudents">0</h2>
<p>Students</p>
</div>

<div class="card">
<h2 id="avgProgress">0%</h2>
<p>Avg Progress</p>
</div>

<div class="card">
<h2 id="totalViews">0</h2>
<p>Total Records</p>
</div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Student</th>
<th>Video</th>
<th>Progress</th>
<th>Watch Time</th>
<th>Skips</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(async () => {

const user = JSON.parse(localStorage.getItem("user"));

// ❌ مفيش user
if (!user) {
  window.location.href = "admin-login.html";
  return;
}

// 🌍 جلب IP الحالي
const ip = await fetch("https://api.ipify.org?format=json")
.then(r => r.json())
.then(d => d.ip);

// ❌ مش admin أو IP مختلف
if (user.role !== "admin" || user.ip !== ip) {
  window.location.href = "admin-login.html";
  return;
}

// 👇 بعد ما التحقق ينجح فقط
document.getElementById("adminName").innerText =
user.full_name || user.name || "Admin";

})();
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= LOCAL USER CHECK ================= */


/* ================= LOAD ================= */
async function loadData(){

const { data, error } = await client
.from("video_sessions")
.select("*")
.order("updated_at",{ascending:false});

if(error){
console.log(error);
return;
}

allData = data || [];

render(allData);
updateStats(allData);
}

/* ================= RENDER ================= */
function render(data){

const tbody = document.getElementById("tableBody");
tbody.innerHTML = "";

const sorted = [...data].sort((a,b)=>(b.percent||0)-(a.percent||0));

sorted.forEach(row=>{

const percent = Number(row.percent || 0);
const skips = Number(row.skips || 0);
const time = Number(row.watched_seconds || 0);

let status = "mid";
let label = "In Progress";

if(percent >= 90){
status = "good";
label = "Completed";
}else if(percent < 30){
status = "bad";
label = "Low Engagement";
}

if(skips > 5){
status = "bad";
label = "Suspicious Activity";
}

tbody.innerHTML += `
<tr>
<td>${row.student_id || "-"}</td>
<td>${row.video_id || "-"}</td>
<td>${percent.toFixed(1)}%</td>
<td>${time}s</td>
<td>${skips}</td>
<td class="${status}">${label}</td>
</tr>
`;
});
}

/* ================= STATS ================= */
function updateStats(data){

const students = new Set(data.map(d => d.student_id)).size;

const avg = data.length
? data.reduce((a,b)=>a + (b.percent || 0),0) / data.length
: 0;

document.getElementById("totalStudents").innerText = students;
document.getElementById("avgProgress").innerText = avg.toFixed(1) + "%";
document.getElementById("totalViews").innerText = data.length;
}

/* INIT */
loadData();

</script>

</body>
</html>
