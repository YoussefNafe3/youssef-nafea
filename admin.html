if(isAdmin !== "true"){
  window.location.href = "admin-login.html";

<script>

}

</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{
font-family: Arial;
background:#111;
color:white;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border:1px solid #444;
text-align:center;
}

button{
padding:5px 10px;
cursor:pointer;
}
</style>
</head>
<body>

<h2>🔥 Admin Panel - Students</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Name</th>
<th>Activated</th>
<th>Action</th>
</tr>
</thead>

<tbody id="studentsTable"></tbody>
</table>

<script type="module">
import { supabase } from './supabase.js';

async function loadStudents(){

  const { data } = await supabase
    .from('students')
    .select('*');

  const table = document.getElementById("studentsTable");

  table.innerHTML = "";

  data.forEach(student => {

    table.innerHTML += `
      <tr>
        <td>${student.email}</td>
        <td>${student.full_name}</td>
        <td>${student.activated ? "✅" : "❌"}</td>
        <td>
          <button onclick="toggle('${student.email}', ${student.activated})">
            Toggle
          </button>
        </td>
      </tr>
    `;
  });
}

window.toggle = async function(email, status){

  await supabase
    .from('students')
    .update({ activated: !status })
    .eq('email', email);

  loadStudents();
};

loadStudents();
</script>

</body>
</html>
