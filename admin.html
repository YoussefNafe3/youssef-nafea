<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0b1220,#0f172a,#111827);
color:white;
min-height:100vh;
display:flex;
overflow-x:hidden;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:260px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(20px);
border-left:1px solid rgba(255,255,255,0.08);
padding:20px;
position:sticky;
top:0;
height:100vh;
}

.brand{
font-size:20px;
font-weight:800;
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

.admin-card{
background:rgba(255,255,255,0.06);
padding:15px;
border-radius:14px;
text-align:center;
margin-bottom:20px;
}

.menu a{
display:block;
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,0.05);
border-radius:10px;
color:white;
text-decoration:none;
transition:.3s;
}

.menu a:hover{
background:#2563eb;
transform:translateX(-4px);
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

/* ================= TOPBAR ================= */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout-btn{
background:#ef4444;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
cursor:pointer;
font-weight:700;
}

/* ================= STATS ================= */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:20px;
border-radius:16px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
transition:.3s;
}

.stat:hover{
transform:translateY(-5px);
}

.stat-number{
font-size:26px;
font-weight:800;
color:#FFD700;
}

/* ================= TABLE ================= */
.section{
background:rgba(255,255,255,0.04);
padding:20px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.08);
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.08);
}

th{
color:#FFD700;
}

/* ================= MOBILE ================= */
@media(max-width:900px){
body{
flex-direction:column;
}

.sidebar{
width:100%;
height:auto;
position:relative;
}

}

/* ================= BUTTONS ================= */
button{
padding:8px 12px;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}


/* Premium responsive admin refresh — presentation only */
:root{--admin-violet:#7664df;--admin-gold:#f4d77e;--admin-line:rgba(174,160,255,.18)}
body{background:radial-gradient(ellipse at 12% 5%,rgba(118,100,223,.17),transparent 34%),radial-gradient(ellipse at 88% 95%,rgba(244,215,126,.07),transparent 30%),linear-gradient(135deg,#080b1b,#11152f 55%,#090d20)}
.sidebar{background:rgba(18,22,49,.78);border-left:1px solid var(--admin-line);box-shadow:0 18px 50px rgba(0,0,0,.18)}
.brand{color:var(--admin-gold);letter-spacing:.2px}
.admin-card,.section,.stat{background:linear-gradient(145deg,rgba(27,32,67,.72),rgba(14,18,42,.72));border:1px solid var(--admin-line);box-shadow:0 16px 40px rgba(0,0,0,.12)}
.menu a{border:1px solid rgba(174,160,255,.1);transition:background .2s,border-color .2s,transform .2s}
.menu a:hover,.menu a:focus-visible{background:linear-gradient(120deg,rgba(118,100,223,.3),rgba(81,64,170,.2));border-color:rgba(174,160,255,.35)}
.topbar{gap:12px;flex-wrap:wrap}
.topbar h2{font-size:clamp(20px,2.5vw,28px)}
.logout-btn{background:linear-gradient(135deg,#b93856,#8e2948);box-shadow:0 8px 22px rgba(185,56,86,.18)}
.stat-number{color:var(--admin-gold)}
.section{overflow:hidden}
.section table{display:block;max-width:100%;overflow-x:auto;white-space:nowrap;border-radius:12px;scrollbar-width:thin}
th{color:var(--admin-gold)}
button:focus-visible,.menu a:focus-visible{outline:3px solid rgba(244,215,126,.85);outline-offset:3px}
@media(max-width:900px){
 body{display:flex;flex-direction:column}
 .sidebar{position:relative;width:100%;height:auto;padding:14px;border-left:0;border-bottom:1px solid var(--admin-line)}
 .brand{margin-bottom:12px;font-size:18px}
 .admin-card{margin-bottom:12px;padding:11px}
 .menu{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:thin}
 .menu a{flex:0 0 auto;white-space:nowrap;margin:0;padding:10px 13px;font-size:13px}
 .main{min-width:0;width:100%;padding:14px}
 .topbar{align-items:flex-start}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .stat{padding:16px 12px}
 .section{padding:14px}
 .section h3{font-size:18px}
}
@media(max-width:480px){
 .main{padding:10px}
 .topbar{align-items:center}
 .topbar h2{font-size:19px}
 .logout-btn{padding:9px 11px;font-size:12px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .stat-number{font-size:23px}
 .section{padding:11px;border-radius:14px}
 th,td{padding:10px 12px;font-size:12px}
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="brand">🧬 Dr Youssef Nafea</div>

<div class="admin-card">
<div id="adminName">Admin</div>
</div>

<div class="menu">
  <td>
<button
onclick="forceStudentLogout('${s.id}')"
>
🔓 فصل الجهاز
</button>
</td>
<a href="admin.html">🏠 الرئيسية</a>

<a href="admin-results.html">
    🏆 النتائج
</a>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h2>لوحة التحكم</h2>
<button class="logout-btn" onclick="logout()">تسجيل خروج</button>
</div>

<!-- STATS -->
<div class="stats">

<div class="stat">
<div class="stat-number" id="studentsCount">0</div>
<div>الطلاب</div>
</div>

<div class="stat">
<div class="stat-number" id="videosCount">0</div>
<div>الفيديوهات</div>
</div>

<div class="stat">
<div class="stat-number" id="viewsCount">0%</div>
<div>متوسط المشاهدة</div>
</div>

</div>

<!-- STUDENTS -->
<div class="section">
<h3>الطلاب</h3>

<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>Premium</th>
<th>الحالة</th>
</tr>
</thead>

<tbody id="studentsTable"></tbody>
</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= LOGOUT ================= */
async function logout(){

const sessionId =
localStorage.getItem(
"platform_session_id"
);


try{

if(sessionId){

await client.rpc(
"release_student_session",
{
p_session_id:sessionId
}
);

}

}catch(e){

console.error(e);

}


try{

await client.auth.signOut();

}catch(e){

console.error(e);

}


localStorage.removeItem(
"platform_session_id"
);

localStorage.removeItem(
"user"
);


window.location.replace(
"login.html"
);

}
async function forceStudentLogout(studentId){

if(
!confirm(
"هل تريد إنهاء جلسة هذا الطالب؟"
)
){
return;
}


const {
data,
error
} =
await client.rpc(
"admin_end_student_session",
{
p_student_id:studentId
}
);


if(error){

console.error(error);

alert(
"حدث خطأ أثناء إنهاء الجلسة"
);

return;

}


if(data?.success){

alert(
"تم إنهاء جلسة الطالب بنجاح"
);

}else{

alert(
"تعذر إنهاء الجلسة"
);

}

}
/* ================= LOAD ================= */
async function loadStudents(){

const { data } = await client.from("students").select("*");

document.getElementById("studentsCount").innerText = data?.length || 0;

const table = document.getElementById("studentsTable");
table.innerHTML = "";

data?.forEach(s=>{

table.innerHTML += `
<tr>
<td>${s.full_name || "-"}</td>
<td>${s.phone || "-"}</td>
<td>${s.is_premium ? "⭐" : "-"}</td>
<td>${s.activated ? "✅" : "❌"}</td>
</tr>
`;

});

}

async function loadVideos(){

const { count } = await client
.from("videos")
.select("*",{count:"exact",head:true});

document.getElementById("videosCount").innerText = count || 0;

}

async function loadAnalytics(){

const { data } = await client.from("student_progress").select("*");

let total = 0;

data?.forEach(d=>{
total += d.progress || 0;
});

let avg = data?.length ? total / data.length : 0;

document.getElementById("viewsCount").innerText = avg.toFixed(1) + "%";

}

loadStudents();
loadVideos();
loadAnalytics();

</script>

</body>
</html>
