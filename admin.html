<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم | الأدمن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
}

.brand{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.admin-card{
background:rgba(255,255,255,.05);
padding:15px;
border-radius:12px;
text-align:center;
margin-bottom:20px;
}

.menu a{
display:block;
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:10px;
color:white;
text-decoration:none;
transition:.3s;
}

.menu a:hover{
background:#2563eb;
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout-btn{
background:#ef4444;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
cursor:pointer;
}

/* ================= STATS ================= */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:15px;
text-align:center;
}

.stat-number{
font-size:28px;
font-weight:800;
color:#FFD700;
}

/* ================= TABLE ================= */
.section{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.1);
}

button{
padding:6px 10px;
border:none;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="brand">Dr Youssef Nafea</div>

<div class="admin-card">
<div id="adminName">Admin</div>
</div>

<div class="menu">

<a href="admin.html">🏠 الرئيسية</a>
<a href="#students">👨‍🎓 الطلاب</a>
<a href="admin-videos.html">🎥 الفيديوهات</a>
<a href="admin-analytics.html">📈 التحليلات</a>
<a href="#sessions">📅 الحصص</a>
<a href="#announcements">📢 الإعلانات</a>

</div>
<div style="background:#111827;padding:20px;border-radius:15px;margin-bottom:20px">

  <h2>رفع فيديو جديد</h2>

  <input id="title" placeholder="عنوان الفيديو" style="width:100%;padding:10px;margin:5px 0">

  <input id="url" placeholder="رابط الفيديو" style="width:100%;padding:10px;margin:5px 0">

  <!-- 👇 اختيار الصف -->
  <select id="class_group" style="width:100%;padding:10px;margin:5px 0">
    <option value="first_science">أولى ثانوي (علوم متكاملة)</option>
    <option value="third_biology">تالتة ثانوي (أحياء)</option>
    <option value="third_geology">تالتة ثانوي (جيولوجيا)</option>
  </select>

  <button onclick="addVideo()" style="width:100%;padding:10px;background:#2563eb;color:white;border:none">
    رفع الفيديو
  </button>

</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h2>لوحة التحكم</h2>
<button class="logout-btn" onclick="logout()">تسجيل خروج</button>
</div>

<!-- STATS -->
<div class="stats">

<div class="stat">
<div class="stat-number" id="studentsCount">0</div>
<div>الطلاب</div>
</div>

<div class="stat">
<div class="stat-number" id="videosCount">0</div>
<div>الفيديوهات</div>
</div>

<div class="stat">
<div class="stat-number" id="viewsCount">0%</div>
<div>متوسط المشاهدة</div>
</div>

</div>

<!-- STUDENTS -->
<div class="section" id="students">
<h3>الطلاب</h3>

<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>Premium</th>
<th>الحالة</th>
</tr>
</thead>

<tbody id="studentsTable"></tbody>
</table>
</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async () => {

const user = JSON.parse(localStorage.getItem("user"));

// ❌ مفيش يوزر
if (!user) {
  window.location.href = "admin-login.html";
  return;
}

// 🌍 هات IP الحالي
const ip = await fetch("https://api.ipify.org?format=json")

// ❌ check admin + IP
if (user.role !== "admin" || user.ip !== ip) {
  window.location.href = "admin-login.html";
  return;
}

})();
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= AUTH ================= */


/* ================= LOAD STUDENTS ================= */
async function loadStudents(){

const { data } = await client.from("students").select("*");

document.getElementById("studentsCount").innerText = data?.length || 0;

const table = document.getElementById("studentsTable");
table.innerHTML = "";

data?.forEach(s=>{

table.innerHTML += `
<tr>
<td>${s.full_name || "-"}</td>
<td>${s.phone || "-"}</td>

<td>
${s.is_premium
? "⭐ نعم"
: "—"}
</td>

<td>
${s.activated
? "✅ مفعل"
: "❌ غير مفعل"}
</td>
</tr>
`;

});

}

/* ================= LOAD VIDEOS ================= */
async function loadVideos(){

const { count } = await client
.from("videos")
.select("*",{count:"exact",head:true});

document.getElementById("videosCount").innerText = count || 0;

}

/* ================= ANALYTICS ================= */
async function loadAnalytics(){

const { data } = await client
.from("student_progress")
.select("*");

let total = 0;

data?.forEach(d=>{
total += d.progress || 0;
});

let avg = data?.length ? total / data.length : 0;

document.getElementById("viewsCount").innerText =
avg.toFixed(1) + "%";

}

/* ================= LOGOUT ================= */
function logout(){
localStorage.removeItem("user");
window.location.href="login.html";
}

/* ================= INIT ================= */
loadStudents();
loadVideos();
loadAnalytics();
async function addVideo() {

  const title = document.getElementById("title").value;
  const url = document.getElementById("url").value;
  const class_group = document.getElementById("class_group").value;

  if (!title || !url) {
    alert("املأ البيانات");
    return;
  }

  const { data, error } = await client.from("videos").insert([{
    title,
    url,
    class_group
  }]);

  if (error) {
    console.log(error);
    alert("حصل خطأ");
  } else {
    alert("تم رفع الفيديو بنجاح");
    loadVideos(); // تحديث القائمة فورًا
  }
}
</script>

</body>
</html>
