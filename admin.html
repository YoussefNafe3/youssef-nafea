<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم | Dr Youssef Nafea</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#0b1220;
  --panel:#111827;
  --panel2:#0f172a;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --gold:#FFD700;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
  --border:rgba(255,255,255,.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
}

body{
  background:radial-gradient(circle at top,#111827,#0b1220);
  color:var(--text);
  min-height:100vh;
  display:flex;
}

/* ================= SIDEBAR ================= */
.sidebar{
  width:290px;
  background:rgba(17,24,39,.95);
  border-left:1px solid var(--border);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.brand{
  font-size:20px;
  font-weight:800;
  color:var(--gold);
  text-align:center;
  padding:10px;
}

.admin-card{
  background:rgba(255,255,255,.05);
  padding:12px;
  border-radius:12px;
  text-align:center;
  font-weight:700;
}

.menu a{
  display:block;
  padding:12px;
  margin-bottom:8px;
  border-radius:10px;
  text-decoration:none;
  color:var(--text);
  background:rgba(255,255,255,.04);
  transition:.3s;
  font-weight:600;
}

.menu a:hover{
  background:var(--blue);
  transform:translateX(-3px);
}

/* ================= MAIN ================= */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logout-btn{
  background:var(--red);
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* ================= STATS ================= */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  padding:18px;
  border-radius:16px;
  text-align:center;
}

.stat-number{
  font-size:28px;
  font-weight:800;
  color:var(--gold);
}

/* ================= SECTION ================= */
.section{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  padding:18px;
  border-radius:16px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  overflow:hidden;
  border-radius:12px;
}

th{
  background:rgba(255,255,255,.05);
  padding:12px;
  color:var(--gold);
}

td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

tr:hover{
  background:rgba(255,255,255,.03);
}

/* ================= CARDS ================= */
.quick{
  margin-bottom:20px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  padding:15px;
  border-radius:16px;
}

.quick a{
  display:block;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  text-align:center;
  text-decoration:none;
  color:white;
  font-weight:700;
  background:var(--blue);
  transition:.3s;
}

.quick a:hover{
  transform:scale(1.03);
}

.quick a.green{ background:var(--green); }

/* ===================== RESPONSIVE FIX (MOBILE PRO) ===================== */

@media (max-width: 768px) {

  body {
    flex-direction: column;
    overflow-y: auto !important;
    height: auto !important;
  }

  /* SIDEBAR تتحول لتوب */
  .sidebar {
    width: 100%;
    border-left: none;
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: relative;
  }

  .menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .menu a {
    text-align: center;
    font-size: 13px;
    padding: 10px;
  }

  /* MAIN */
  .main {
    padding: 12px;
  }

  .topbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  /* STATS */
  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .stat-number {
    font-size: 22px;
  }

  /* TABLE FIX */
  .section {
    overflow-x: auto;
  }

  table {
    min-width: 600px;
    font-size: 12px;
  }

  th, td {
    padding: 8px;
  }

}

/* ================= VERY SMALL PHONES ================= */

@media (max-width: 480px) {

  .brand {
    font-size: 18px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .menu {
    grid-template-columns: 1fr;
  }

  .logout-btn {
    width: 100%;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="brand">Dr Youssef Nafea</div>

<div class="admin-card" id="adminName">Admin</div>

<div class="menu">
<a href="admin.html">🏠 الرئيسية</a>
<a href="admin-videos.html">🎥 الفيديوهات</a>
<a href="admin-analytics.html">📊 التحليلات</a>
</div>

<div class="quick">
<h3 style="color:var(--gold)">⚡ اختصارات</h3>

<a href="admin-videos.html">🎥 إدارة الفيديوهات</a>
<a class="green" href="admin-analytics.html">📊 التحليلات</a>

<div style="margin-top:10px;text-align:center">
👨‍🎓 الطلاب: <b id="studentsCountSide">0</b>
</div>

<div style="text-align:center;margin-top:8px">
🎬 الفيديوهات: <b id="videosCountSide">0</b>
</div>

</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h2>لوحة التحكم</h2>
<button class="logout-btn" onclick="logout()">تسجيل خروج</button>
</div>

<!-- STATS -->
<div class="stats">

<div class="stat">
<div class="stat-number" id="studentsCount">0</div>
<div>الطلاب</div>
</div>

<div class="stat">
<div class="stat-number" id="videosCount">0</div>
<div>الفيديوهات</div>
</div>

<div class="stat">
<div class="stat-number" id="viewsCount">0%</div>
<div>متوسط المشاهدة</div>
</div>

</div>

<!-- STUDENTS -->
<div class="section">
<h3>الطلاب</h3>

<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>Premium</th>
<th>الحالة</th>
</tr>
</thead>
<tbody id="studentsTable"></tbody>
</table>

</div>

</div>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* AUTH */
function logout(){

  localStorage.clear();

  client.auth.signOut();

  history.pushState(null, "", location.href);

  window.location.replace("login.html");

}
/* LOAD STUDENTS */
async function loadStudents(){

const { data } = await client.from("students").select("*");

document.getElementById("studentsCount").innerText = data?.length || 0;
document.getElementById("studentsCountSide").innerText = data?.length || 0;

const table = document.getElementById("studentsTable");
table.innerHTML = "";

data?.forEach(s=>{
table.innerHTML += `
<tr>
<td>${s.full_name || "-"}</td>
<td>${s.phone || "-"}</td>
<td>${s.is_premium ? "⭐" : "-"}</td>
<td>${s.activated ? "✅" : "❌"}</td>
</tr>
`;
});

}

/* LOAD VIDEOS */
async function loadVideos(){
const { count } = await client.from("videos").select("*",{count:"exact",head:true});

document.getElementById("videosCount").innerText = count || 0;
document.getElementById("videosCountSide").innerText = count || 0;
}

/* LOAD ANALYTICS */
async function loadAnalytics(){

const { data } = await client.from("student_progress").select("*");

let total = 0;

data?.forEach(d=>{
total += d.progress || 0;
});

let avg = data?.length ? total / data.length : 0;

document.getElementById("viewsCount").innerText = avg.toFixed(1) + "%";

}

/* INIT */
loadStudents();
loadVideos();
loadAnalytics();

</script>

</body>
</html>
