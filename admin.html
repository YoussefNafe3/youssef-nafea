<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الفيديوهات | الأدمن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
overflow-y:auto;
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.menu-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.menu-item:hover{
background:#2563eb;
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:22px;
font-weight:800;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.primary{
background:#2563eb;
color:white;
}

/* ================= UPLOAD BOX ================= */
.upload-box{
background:rgba(255,255,255,.05);
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 20px 40px rgba(0,0,0,.3);
}

input, select{
width:100%;
padding:12px;
margin-bottom:12px;
border:none;
border-radius:10px;
outline:none;
}

.file{
background:rgba(255,255,255,.08);
color:white;
}

/* ================= STATUS ================= */
#msg{
margin-top:10px;
font-weight:700;
}

/* ================= TABLE ================= */
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.08);
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">🎬 Admin Panel</div>

<div class="menu-item">📊 Dashboard</div>
<div class="menu-item">🎥 الفيديوهات</div>
<div class="menu-item">👨‍🎓 الطلاب</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">

<div class="title">رفع وإدارة الفيديوهات</div>

<button class="btn primary" onclick="logout()">تسجيل خروج</button>

</div>

<!-- UPLOAD -->
<div class="upload-box">

<h3>🎥 رفع فيديو جديد</h3>

<input id="title" placeholder="عنوان الفيديو">

<select id="isPremium">
<option value="false">مجاني</option>
<option value="true">مدفوع (Premium)</option>
</select>

<input type="file" id="file" class="file" accept="video/*">

<button class="btn primary" onclick="uploadVideo()">
رفع الفيديو
</button>

<div id="msg"></div>

</div>

<!-- LIST -->
<div class="upload-box">

<h3>📂 الفيديوهات الحالية</h3>

<table>
<thead>
<tr>
<th>العنوان</th>
<th>النوع</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= UPLOAD ================= */
async function uploadVideo(){

const title = document.getElementById("title").value;
const file = document.getElementById("file").files[0];
const isPremium = document.getElementById("isPremium").value === "true";
const msg = document.getElementById("msg");

if(!title || !file){
msg.innerText = "ادخل البيانات كاملة";
return;
}

msg.innerText = "جاري الرفع... ⏳";

try{

const fileName = Date.now() + "_" + file.name;

/* 1 upload storage */
const { error: uploadError } = await client
.storage
.from("videos")
.upload(fileName, file);

if(uploadError){
msg.innerText = "فشل رفع الفيديو";
return;
}

/* 2 get URL */
const { data } = client
.storage
.from("videos")
.getPublicUrl(fileName);

/* 3 save DB */
const { error: dbError } = await client
.from("videos")
.insert([{
title: title,
url: data.publicUrl,
is_premium: isPremium
}]);

if(dbError){
msg.innerText = "تم الرفع لكن فشل الحفظ";
return;
}

msg.innerText = "تم رفع الفيديو بنجاح ✅";

loadVideos();

}catch(err){
console.log(err);
msg.innerText = "حدث خطأ غير متوقع";
}

}

/* ================= LOAD ================= */
async function loadVideos(){

const { data } = await client
.from("videos")
.select("*")
.order("created_at",{ascending:false});

const tbody = document.getElementById("list");
tbody.innerHTML = "";

data.forEach(v=>{
tbody.innerHTML += `
<tr>
<td>${v.title}</td>
<td>${v.is_premium ? "🔒 مدفوع" : "🆓 مجاني"}</td>
</tr>
`;
});

}

function logout(){
localStorage.removeItem("user");
window.location.href="login.html";
}

loadVideos();

</script>

</body>
</html>
