<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الفيديوهات | الأدمن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.menu-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.menu-item:hover{
background:#2563eb;
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:22px;
font-weight:800;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.primary{
background:#2563eb;
color:white;
}

/* ================= UPLOAD ================= */
.upload-box{
background:rgba(255,255,255,.05);
padding:25px;
border-radius:20px;
margin-bottom:20px;
}

input, select{
width:100%;
padding:12px;
margin-bottom:12px;
border:none;
border-radius:10px;
outline:none;
}

/* ================= TABLE ================= */
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.08);
}

.delete{
background:#ef4444;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.delete:hover{
background:#dc2626;
}

#msg{
margin-top:10px;
font-weight:700;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">🎬 Admin Panel</div>

<div class="menu-item" onclick="goDashboard()">📊 Dashboard</div>
<div class="menu-item" onclick="goAnalytics()">📈 التحليلات</div>
<div class="menu-item">🎥 الفيديوهات</div>
<div class="menu-item">👨‍🎓 الطلاب</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">

<div class="title">رفع وإدارة الفيديوهات</div>

<button class="btn primary" onclick="logout()">تسجيل خروج</button>

</
