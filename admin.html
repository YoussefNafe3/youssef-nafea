<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0b1220,#0f172a,#111827);
color:white;
min-height:100vh;
display:flex;
overflow-x:hidden;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:260px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(20px);
border-left:1px solid rgba(255,255,255,0.08);
padding:20px;
position:sticky;
top:0;
height:100vh;
}

.brand{
font-size:20px;
font-weight:800;
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

.admin-card{
background:rgba(255,255,255,0.06);
padding:15px;
border-radius:14px;
text-align:center;
margin-bottom:20px;
}

.menu a{
display:block;
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,0.05);
border-radius:10px;
color:white;
text-decoration:none;
transition:.3s;
}

.menu a:hover{
background:#2563eb;
transform:translateX(-4px);
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

/* ================= TOPBAR ================= */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout-btn{
background:#ef4444;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
cursor:pointer;
font-weight:700;
}

/* ================= STATS ================= */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:20px;
border-radius:16px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
transition:.3s;
}

.stat:hover{
transform:translateY(-5px);
}

.stat-number{
font-size:26px;
font-weight:800;
color:#FFD700;
}

/* ================= TABLE ================= */
.section{
background:rgba(255,255,255,0.04);
padding:20px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.08);
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.08);
}

th{
color:#FFD700;
}

/* ================= MOBILE ================= */
@media(max-width:900px){
body{
flex-direction:column;
}

.sidebar{
width:100%;
height:auto;
position:relative;
}

}

/* ================= BUTTONS ================= */
button{
padding:8px 12px;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="brand">🧬 Dr Youssef Nafea</div>

<div class="admin-card">
<div id="adminName">Admin</div>
</div>

<div class="menu">
<a href="admin.html">🏠 الرئيسية</a>
<a href="admin-videos.html">🎥 الفيديوهات</a>
<a href="admin-analytics.html">📊 التحليلات</a>
<a href="admin-files.html">📁 الملفات</a>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h2>لوحة التحكم</h2>
<button class="logout-btn" onclick="logout()">تسجيل خروج</button>
</div>

<!-- STATS -->
<div class="stats">

<div class="stat">
<div class="stat-number" id="studentsCount">0</div>
<div>الطلاب</div>
</div>

<div class="stat">
<div class="stat-number" id="videosCount">0</div>
<div>الفيديوهات</div>
</div>

<div class="stat">
<div class="stat-number" id="viewsCount">0%</div>
<div>متوسط المشاهدة</div>
</div>

</div>

<!-- STUDENTS -->
<div class="section">
<h3>الطلاب</h3>

<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>Premium</th>
<th>الحالة</th>
</tr>
</thead>

<tbody id="studentsTable"></tbody>
</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= LOGOUT ================= */
function logout(){
localStorage.removeItem("user");
window.location.href="login.html";
}

/* ================= LOAD ================= */
async function loadStudents(){

const { data } = await client.from("students").select("*");

document.getElementById("studentsCount").innerText = data?.length || 0;

const table = document.getElementById("studentsTable");
table.innerHTML = "";

data?.forEach(s=>{

table.innerHTML += `
<tr>
<td>${s.full_name || "-"}</td>
<td>${s.phone || "-"}</td>
<td>${s.is_premium ? "⭐" : "-"}</td>
<td>${s.activated ? "✅" : "❌"}</td>
</tr>
`;

});

}

async function loadVideos(){

const { count } = await client
.from("videos")
.select("*",{count:"exact",head:true});

document.getElementById("videosCount").innerText = count || 0;

}

async function loadAnalytics(){

const { data } = await client.from("student_progress").select("*");

let total = 0;

data?.forEach(d=>{
total += d.progress || 0;
});

let avg = data?.length ? total / data.length : 0;

document.getElementById("viewsCount").innerText = avg.toFixed(1) + "%";

}

loadStudents();
loadVideos();
loadAnalytics();

</script>

</body>
</html>
