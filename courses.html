<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكورسات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:
linear-gradient(rgba(7,15,30,.88),rgba(7,15,30,.88)),
url('https://images.pexels.com/photos/2280549/pexels-photo-2280549.jpeg?auto=compress&cs=tinysrgb&w=2000');

background-size:cover;
background-position:center;
}

.card{
width:min(90%,700px);

padding:60px 40px;
text-align:center;

background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);
border-radius:30px;

box-shadow:0 30px 80px rgba(0,0,0,.4);

animation:fadeUp 1s ease;
}

.icon{
font-size:90px;
margin-bottom:20px;
animation:float 4s ease-in-out infinite;
}

h1{
font-size:55px;
color:#FFD700;
margin-bottom:15px;
}

p{
font-size:22px;
line-height:1.9;
color:white;
opacity:.95;
}

.badge{
display:inline-block;
margin-top:25px;
padding:12px 25px;

background:linear-gradient(135deg,#FFD700,#ffb300);

color:#111;
font-weight:800;
border-radius:50px;
}

.home-btn{
display:inline-block;
margin-top:30px;

padding:14px 30px;

background:white;
color:#111;

text-decoration:none;
border-radius:50px;
font-weight:700;

transition:.3s;
}

.home-btn:hover{
transform:translateY(-4px);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-15px);
}
}

@media(max-width:768px){

h1{
font-size:38px;
}

p{
font-size:18px;
}

.icon{
font-size:70px;
}
}
</style>
</head>

<body>

<div class="card">

<div class="icon">🚀</div>

<h1>قريبــــاً</h1>

<p>
نعمل حالياً على تجهيز مكتبة كورسات احترافية
بأفضل جودة تعليمية لمساعدة الطلاب على التفوق وتحقيق أعلى الدرجات.
</p>

<div class="badge">
✨ سيتم إطلاق الكورسات قريباً
</div>

<br>

<a href="index.html" class="home-btn">
العودة للصفحة الرئيسية
</a>

</div>

</body>
</html>
