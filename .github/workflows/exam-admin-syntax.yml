name: Exam admin JavaScript syntax check
on:
  push:
    paths:
      - 'admin-online-exams*.html'
      - '.github/workflows/exam-admin-syntax.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse inline JavaScript in exam admin pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const expected = ['admin-online-exams.html', 'admin-online-exams-v3.html'];
          const re = new RegExp('<script\\b(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)<\\/script>', 'gi');
          let failed = false;

          for (const file of expected) {
            if (!fs.existsSync(file)) {
              failed = true;
              console.error('MISSING REQUIRED PAGE:', file);
              continue;
            }
            const html = fs.readFileSync(file, 'utf8');
            let match;
            let count = 0;
            while ((match = re.exec(html))) {
              count++;
              const line = html.slice(0, match.index).split(String.fromCharCode(10)).length;
              const tmp = '/tmp/exam-admin-' + file.replace(/[^a-z0-9]/gi, '-') + '-' + count + '.js';
              fs.writeFileSync(tmp, match[1], 'utf8');
              const result = cp.spawnSync(process.execPath, ['--check', tmp], { encoding: 'utf8' });
              if (result.status !== 0) {
                failed = true;
                console.error('SYNTAX ERROR:', file, 'inline script starts at HTML line', line);
                process.stderr.write(result.stderr || result.stdout);
              } else {
                console.log('PASS:', file, 'inline script', count);
              }
            }
            if (count === 0) {
              failed = true;
              console.error('NO INLINE SCRIPT FOUND:', file);
            }
          }
          if (failed) process.exit(1);
          console.log('All required exam admin pages passed JavaScript syntax validation.');
          NODE
