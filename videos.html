<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفيديوهات | د. يوسف نافع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111f;--panel:#0d1b2f;--panel2:#101f36;--line:rgba(255,255,255,.08);
  --text:#f5f7fb;--muted:#9fb0c8;--blue:#2563eb;--blue2:#3b82f6;
  --gold:#f5c542;--danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,sans-serif}
html,body{min-height:100%;background:linear-gradient(135deg,#06101d,#0b1727 50%,#101c30);color:var(--text)}
body{min-height:100vh;display:flex;overflow-x:hidden}.hidden{display:none!important}
button,input,select{font:inherit}.app{width:100%;display:flex;min-height:100vh}
.sidebar{width:315px;background:rgba(7,17,31,.96);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;z-index:20}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:var(--gold);font-size:22px;padding:8px}
.count{color:var(--muted);font-size:13px;text-align:center}.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#0a1626;color:#fff;outline:none}.search:focus{border-color:rgba(59,130,246,.6)}
.videoList{display:flex;flex-direction:column;gap:9px}.videoItem{border:1px solid transparent;background:rgba(255,255,255,.035);padding:13px;border-radius:13px;cursor:pointer;transition:.2s}.videoItem:hover,.videoItem.active{background:rgba(37,99,235,.18);border-color:rgba(59,130,246,.4)}
.videoItemTitle{font-size:14px;font-weight:700;line-height:1.65}.videoItemMeta{margin-top:5px;color:var(--muted);font-size:11px}.emptyItem,.loadingItem{color:var(--muted);font-size:13px;padding:18px;text-align:center;background:rgba(255,255,255,.025);border-radius:12px}
.main{flex:1;padding:18px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.topLeft{display:flex;align-items:center;gap:10px;min-width:0}.pageTitle{font-size:19px;font-weight:800}.studentChip{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.studentName{font-weight:700}.idBadge{padding:4px 9px;border-radius:999px;background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.25);color:var(--gold);font-size:11px;font-weight:700}.topActions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700;color:#fff;background:var(--blue)}.btn.secondary{background:#17263e}.btn.danger{background:#7f1d1d}.btn:hover{filter:brightness(1.07)}.mobileMenu{display:none}
.playerCard{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.playerHeader{padding:16px 18px;border-bottom:1px solid var(--line);background:rgba(7,17,31,.55)}#videoTitle{font-size:20px;font-weight:800;line-height:1.6}#videoSubtitle{color:var(--muted);font-size:12px;margin-top:3px}
.stage{position:relative;background:#000;aspect-ratio:16/9;min-height:250px;overflow:hidden}.stage video,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.ytBlocker{position:absolute;top:0;left:0;right:0;height:76px;background:transparent;z-index:20;pointer-events:auto;cursor:default}.ytTitleBlocker{position:absolute;top:0;left:0;right:0;height:76px;background:transparent;z-index:21;pointer-events:auto;cursor:default}.ytBottomBlocker{position:absolute;left:0;right:0;bottom:0;height:76px;background:transparent;z-index:20;pointer-events:auto;cursor:default}
.watermark{position:absolute;z-index:12;pointer-events:none;user-select:none;color:rgba(255,255,255,.38);font-size:11px;line-height:1.7;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:pre-line;direction:rtl;text-align:center;background:rgba(0,0,0,.10);padding:2px 5px;border-radius:5px}
.captureShield{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;padding:25px;z-index:100;color:#fff;font-weight:800}.captureShield.show{display:flex}.captureShield small{display:block;color:#aaa;margin-top:8px;font-weight:500}
.playerControls{padding:14px 18px;background:rgba(8,18,32,.82)}.controlRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.speedGroup{display:flex;gap:6px;flex-wrap:wrap}.speedBtn{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#12223a;color:#fff;cursor:pointer}.speedBtn.active{background:var(--blue);border-color:var(--blue)}
.qualitySelect{padding:8px 10px;background:#12223a;border:1px solid var(--line);border-radius:9px;color:#fff}.completeBtn{margin-inline-start:auto;background:#14532d}.completeBtn:disabled{opacity:.6;cursor:not-allowed}.fullscreenBtn{background:#17263e}.progressInfo{display:flex;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:12px}.progress{height:7px;background:#172235;border-radius:999px;overflow:hidden;margin-top:7px}.progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .2s}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid var(--line);padding:11px 14px;border-radius:12px;z-index:100000;color:#fff;box-shadow:0 15px 40px rgba(0,0,0,.3)}
.antiRecord{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:99999;color:#fff;text-align:center;padding:30px}.antiRecord.show{display:flex}.antiBox{max-width:520px}.antiTitle{font-size:20px;font-weight:800}.antiText{margin-top:8px;color:#aaa;font-size:13px;line-height:1.8}
.playerCard:fullscreen{width:100vw;height:100vh;border-radius:0;border:0;display:flex;flex-direction:column;background:#000}.playerCard:fullscreen .playerHeader{flex:0 0 auto}.playerCard:fullscreen .stage{flex:1;min-height:0;height:auto;aspect-ratio:auto}.playerCard:fullscreen .playerControls{flex:0 0 auto}.playerCard:-webkit-full-screen{width:100vw;height:100vh;border-radius:0;border:0;display:flex;flex-direction:column;background:#000}.playerCard:-webkit-full-screen .stage{flex:1;min-height:0;height:auto;aspect-ratio:auto}
@media(max-width:1000px){body{display:block}.sidebar{position:fixed;top:0;right:-330px;width:320px;transition:right .25s;height:100vh}.sidebar.open{right:0}.mobileMenu{display:inline-flex}.main{padding:12px}.topbar{align-items:flex-start;flex-wrap:wrap}.topActions{width:100%}.stage{aspect-ratio:16/9;min-height:200px}.completeBtn{margin-inline-start:0}.studentChip{width:100%}}
@media(max-width:560px){.main{padding:8px}.playerCard{border-radius:14px}.playerHeader{padding:12px}.playerControls{padding:12px}#videoTitle{font-size:16px}.topbar{gap:9px}.topActions .btn{flex:1}.stage{min-height:190px}.watermark{font-size:9px}.videoItem{padding:11px}.fullscreenBtn{min-width:44px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">🎬 الفيديوهات</div>
  <div class="count">عدد الدروس: <span id="videoCount">0</span></div>
  <input id="searchInput" class="search" type="search" placeholder="ابحث عن درس..." autocomplete="off">
  <div id="videoList" class="videoList"><div class="loadingItem">جاري تحميل الدروس...</div></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="topLeft">
      <button id="mobileMenu" class="btn secondary mobileMenu" type="button">☰</button>
      <div>
        <div class="pageTitle">📚 المحتوى التعليمي</div>
        <div class="studentChip"><span id="studentName" class="studentName">الطالب</span><span id="studentId" class="idBadge">ID: 000</span></div>
      </div>
    </div>
    <div class="topActions">
      <button class="btn secondary" type="button" onclick="window.location.href='dashboard.html'">⌂ الرئيسية</button>
      <button id="logoutBtn" class="btn danger" type="button">تسجيل الخروج</button>
    </div>
  </div>

  <section class="playerCard" id="playerCard">
    <div class="playerHeader">
      <div id="videoTitle">اختر درسًا من القائمة</div>
      <div id="videoSubtitle">سيظهر محتوى الدرس هنا بعد اختياره.</div>
    </div>
    <div id="stage" class="stage">
      <video id="videoPlayer" controls controlsList="nodownload noplaybackrate nofullscreen" playsinline webkit-playsinline preload="metadata"></video>
      <div id="youtubePlayer" class="hidden"></div>
      <div id="ytTitleBlocker" class="ytTitleBlocker hidden"></div>
      <div id="ytBlocker" class="ytBlocker hidden"></div>
      <div id="ytBottomBlocker" class="ytBottomBlocker hidden"></div>
      <div id="watermark" class="watermark"></div>
      <div id="captureShield" class="captureShield"><div><div>⚠️ تم إيقاف العرض</div><small>تم إخفاء المحتوى لحماية الدرس.</small></div></div>
    </div>
    <div class="playerControls">
      <div class="controlRow">
        <div class="speedGroup" id="speedGroup">
          <button class="speedBtn active" data-speed="1" type="button">1x</button>
          <button class="speedBtn" data-speed="1.25" type="button">1.25x</button>
          <button class="speedBtn" data-speed="1.5" type="button">1.5x</button>
          <button class="speedBtn" data-speed="2" type="button">2x</button>
        </div>
        <select id="qualitySelect" class="qualitySelect hidden" aria-label="جودة الفيديو"><option value="auto">جودة تلقائية</option></select>
        <button id="fullscreenBtn" class="btn fullscreenBtn" type="button">⛶ ملء الشاشة</button>
      </div>
      <div class="progressInfo"><span>التقدم</span><span id="percentBox">0%</span></div>
      <div class="progress"><div id="progressBar" class="progressBar"></div></div>
    </div>
  </section>
</main>
</div>
<div id="antiRecord" class="antiRecord"><div class="antiBox"><div class="antiTitle">⚠️ تم إيقاف العرض مؤقتًا</div><div class="antiText">تم إخفاء المحتوى لحماية الدرس. عند استعادة الصفحة يمكنك المتابعة.</div></div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* =========================================================
   SUPABASE — نفس بيانات الصفحة الحالية
========================================================= */
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const videoList = $("videoList"), video = $("videoPlayer"), youtubePlayer = $("youtubePlayer"), stage = $("stage"), playerCard = $("playerCard");
const videoTitle = $("videoTitle"), videoSubtitle = $("videoSubtitle"), videoCount = $("videoCount"), progressBar = $("progressBar"), percentBox = $("percentBox");
const qualitySelect = $("qualitySelect"), watermark = $("watermark"), toastBox = $("toast"), antiRecord = $("antiRecord"), captureShield = $("captureShield"), fullscreenBtn = $("fullscreenBtn");
const sidebar = $("sidebar");

let savedUser = {};
try { savedUser = JSON.parse(localStorage.getItem("user") || "{}") || {}; } catch { savedUser = {}; }

const user = {
  id: savedUser.id || "000",
  name: savedUser.name || savedUser.full_name || "الطالب",
  email: savedUser.email || "unknown",
  phone: savedUser.phone || savedUser.mobile || "غير مسجل",
  class_group: savedUser.class_group || "unknown"
};

const state = {
  all: [], filtered: [], currentVideoId: null, currentVideo: null,
  lastTime: 0, sessionSaved: false, skips: 0, completedByEnd: false, watchedRanges: [],
  yt: null, ytReady: false, ytQuality: "auto", sessionTimer: null,
  toastTimer: null, watermarkTimer: null, captureShieldActive: false,
  wasPlayingBeforeShield: false, fullscreenRedirecting: false
};

function updateUserUI(){
  $("studentName").textContent = user.name || "الطالب";
  $("studentId").textContent = "ID: " + (user.id || "000");
}

function toast(msg){
  clearTimeout(state.toastTimer);
  toastBox.textContent = msg;
  toastBox.classList.remove("hidden");
  state.toastTimer = setTimeout(() => toastBox.classList.add("hidden"), 3000);
}

async function getCurrentUser(){
  try{
    const {data: authData} = await client.auth.getUser();
    const authUser = authData?.user || null;
    if(authUser){
      user.id = authUser.id || user.id;
      user.email = authUser.email || user.email;
      user.phone = authUser.phone || user.phone;

      try{
        const {data: studentData} = await client.from("students").select("*").eq("id", authUser.id).maybeSingle();
        if(studentData){
          user.name = studentData.full_name || studentData.name || studentData.phone || user.name;
          user.phone = studentData.phone || user.phone;
          user.class_group = studentData.class_group || user.class_group;
        }
      }catch(e){ console.warn("[Student lookup]", e); }

      try{
        const {data: profileData} = await client.from("profiles").select("*").eq("id", authUser.id).maybeSingle();
        if(profileData){
          user.name = profileData.full_name || profileData.name || user.name;
          user.phone = profileData.phone || user.phone;
          user.class_group = profileData.class_group || user.class_group;
        }
      }catch(e){ console.warn("[Profile lookup]", e); }
    }
  }catch(e){ console.warn("[Auth fallback]", e); }
  updateUserUI();
  updateWatermark();
}

function updateWatermark(){
  watermark.textContent = `${user.name || "الطالب"}\n${user.phone || "غير مسجل"}`;
}

function moveWatermark(){
  const wmWidth = Math.min(210, Math.max(110, stage.clientWidth * .32));
  const wmHeight = 55;
  const maxX = Math.max(8, stage.clientWidth - wmWidth - 8);
  const maxY = Math.max(8, stage.clientHeight - wmHeight - 8);
  watermark.style.left = Math.floor(8 + Math.random() * Math.max(1, maxX - 8)) + "px";
  watermark.style.top = Math.floor(8 + Math.random() * Math.max(1, maxY - 8)) + "px";
}

function startWatermark(){
  updateWatermark();
  moveWatermark();
  clearInterval(state.watermarkTimer);
  state.watermarkTimer = setInterval(() => { updateWatermark(); moveWatermark(); }, 5000);
}

function mergeRanges(ranges){
  const valid = (ranges || [])
    .filter(r => Array.isArray(r) && r.length === 2 && Number.isFinite(r[0]) && Number.isFinite(r[1]) && r[1] > r[0])
    .sort((a,b) => a[0] - b[0]);
  const merged = [];
  for(const r of valid){
    const last = merged[merged.length - 1];
    if(!last || r[0] > last[1] + 0.25) merged.push([r[0], r[1]]);
    else last[1] = Math.max(last[1], r[1]);
  }
  return merged;
}

function addWatchedRange(start,end){
  if(Number.isFinite(start) && Number.isFinite(end) && end > start) state.watchedRanges = mergeRanges([...state.watchedRanges, [start,end]]);
}
function calculateWatchedSeconds(){ return state.watchedRanges.reduce((sum,r) => sum + (r[1]-r[0]), 0); }
function updateProgressUI(current,duration){
  if(!duration || !Number.isFinite(duration)){ percentBox.textContent = "0%"; progressBar.style.width = "0%"; return; }
  const watched = Math.min(duration, calculateWatchedSeconds());
  const percent = Math.min(100, (watched / duration) * 100);
  percentBox.textContent = percent.toFixed(1) + "%";
  progressBar.style.width = percent + "%";
}

async function loadSavedSession(videoId){
  state.lastTime = 0; state.watchedRanges = []; state.skips = 0; state.completedByEnd = false;
  try{
    const {data,error} = await client.from("video_sessions").select("*").eq("student_id",String(user.id)).eq("video_id",videoId).maybeSingle();
    if(error){ console.warn("[Load session]", error); return; }
    if(data){
      const watched = Number(data.watched_seconds) || 0;
      const duration = Number(data.duration) || 0;
      if(watched > 0 && duration > 0) state.watchedRanges = [[0, watched]];
      state.lastTime = Math.max(0, Math.min(Number(data.last_time) || 0, duration || Number.MAX_SAFE_INTEGER));
      state.skips = Number(data.skips) || 0;
      state.completedByEnd = data.completed === true;
    }
  }catch(e){ console.warn("[Load session]", e); }
}

async function saveSession(){
  if(!state.currentVideoId || !state.currentVideo) return;

  let duration = 0, current = 0;
  if(state.currentVideo.is_youtube){
    try{
      duration = Number(state.yt?.getDuration?.()) || 0;
      current = Number(state.yt?.getCurrentTime?.()) || 0;
    }catch{}
  }else{
    duration = Number(video.duration) || 0;
    current = Number(video.currentTime) || 0;
  }
  if(!duration) return;

  if(!state.currentVideo.is_youtube) addWatchedRange(state.lastTime, current);
  state.lastTime = current;

  const watched = Math.min(duration, calculateWatchedSeconds());
  const percent = Math.min(100, Math.max(0, (watched / duration) * 100));
  const payload = {
    student_id: String(user.id),
    video_id: state.currentVideoId,
    class_group: user.class_group,
    watched_seconds: Math.floor(watched),
    duration: Math.floor(duration),
    percent: Number(percent.toFixed(2)),
    completed: state.completedByEnd || percent >= 90,
    skips: state.skips || 0,
    updated_at: new Date().toISOString()
  };

  try{
    const {error} = await client.from("video_sessions").upsert(payload,{onConflict:"student_id,video_id"});
    if(error) console.warn("[Save session]", error);
    else state.sessionSaved = true;
  }catch(e){ console.warn("[Save session]", e); }
}

function getYouTubeId(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0] || null;
    if(u.hostname.includes("youtube.com")){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2] || null;
      if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2] || null;
    }
  }catch{}
  const m = String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function isYouTubeUrl(url){ return !!getYouTubeId(url); }

function setYouTubeActive(active){
  youtubePlayer.classList.toggle("hidden", !active);
  video.classList.toggle("hidden", active);
  $("ytBlocker").classList.toggle("hidden", !active);
  $("ytBottomBlocker").classList.toggle("hidden", !active);
  $("ytTitleBlocker").classList.toggle("hidden", !active);
}
function destroyYouTube(){ try{ state.yt?.destroy?.(); }catch{} state.yt = null; }
function clearNativeVideo(){ try{ video.pause(); }catch{} video.removeAttribute("src"); video.load(); }
function loadYouTubeAPI(){
  if(window.YT?.Player){ state.ytReady = true; return; }
  if(document.querySelector('script[data-yt-api="1"]')) return;
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api"; s.dataset.ytApi = "1";
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = function(){ state.ytReady = true; if(state.currentVideo?.is_youtube) createYouTubePlayer(state.currentVideo); };

function fillYouTubeQuality(){
  if(!state.yt || !qualitySelect) return;
  let levels = [];
  try{ levels = state.yt.getAvailableQualityLevels?.() || []; }catch{}
  const labels = {highres:"1080p",hd1080:"1080p",hd720:"720p",large:"480p",medium:"360p",small:"240p",tiny:"144p",auto:"تلقائية"};
  qualitySelect.innerHTML = "";
  const add = v => { const o = document.createElement("option"); o.value = v; o.textContent = labels[v] || v; qualitySelect.appendChild(o); };
  add("auto"); [...new Set(levels)].forEach(q => add(q));
  qualitySelect.classList.toggle("hidden", levels.length === 0);
  qualitySelect.value = "auto";
}

function createYouTubePlayer(item){
  const id = getYouTubeId(item.url);
  if(!id || !window.YT?.Player) return;
  destroyYouTube();
  youtubePlayer.innerHTML = "";
  state.yt = new YT.Player(youtubePlayer,{
    videoId:id,width:"100%",height:"100%",
    playerVars:{autoplay:0,controls:1,rel:0,playsinline:1,modestbranding:1,iv_load_policy:3,fs:0,disablekb:1,origin:location.origin},
    events:{
      onReady:async()=>{
        fillYouTubeQuality();
        await loadSavedSession(item.id);
        if(state.lastTime > 0){ try{ state.yt.seekTo(state.lastTime,true); }catch{} }
        updateProgressUI(state.lastTime,state.yt.getDuration?.() || 0);
      },
      onStateChange:e=>{
        if(e.data === YT.PlayerState.PLAYING) startYouTubeProgress();
        if(e.data === YT.PlayerState.PAUSED) saveSession();
        if(e.data === YT.PlayerState.ENDED){
          state.completedByEnd = true;
          const d = Number(state.yt.getDuration?.()) || 0;
          if(d > 0) addWatchedRange(0,d);
          updateProgressUI(d,d);
          saveSession();
          toast("✓ تم إكمال الدرس تلقائيًا");
        }
      }
    }
  });
}

let youtubeProgressTimer = null;
function startYouTubeProgress(){
  clearInterval(youtubeProgressTimer);
  youtubeProgressTimer = setInterval(()=>{
    if(!state.currentVideo?.is_youtube || !state.yt) return;
    let current=0,duration=0;
    try{ current=Number(state.yt.getCurrentTime?.())||0; duration=Number(state.yt.getDuration?.())||0; }catch{return;}
    if(duration){
      if(current > state.lastTime) addWatchedRange(state.lastTime,current);
      state.lastTime=current;
      updateProgressUI(current,duration);
    }
  },1000);
}
function stopYouTubeProgress(){ clearInterval(youtubeProgressTimer); youtubeProgressTimer=null; }

async function selectVideo(item){
  if(!item) return;
  if(!item.url){ toast("هذا الدرس لا يحتوي على رابط فيديو حاليًا."); return; }

  stopYouTubeProgress();
  state.currentVideoId = item.id;
  state.currentVideo = {...item,is_youtube:isYouTubeUrl(item.url)};
  state.lastTime = 0; state.watchedRanges = []; state.skips = 0; state.completedByEnd = false; state.sessionSaved = false;
  videoTitle.textContent = item.title || "بدون عنوان";
  videoSubtitle.textContent = item.class_group ? `المجموعة: ${item.class_group}` : "درس تعليمي";
  document.querySelectorAll(".videoItem").forEach(el => el.classList.toggle("active", String(el.dataset.id) === String(item.id)));

  if(state.currentVideo.is_youtube){
    clearNativeVideo(); setYouTubeActive(true); loadYouTubeAPI();
    if(state.ytReady) createYouTubePlayer(item);
  }else{
    setYouTubeActive(false); destroyYouTube(); prepareNativeVideo(item);
  }
  moveWatermark(); updateProgressUI(0,0);
}

function prepareNativeVideo(item){
  clearNativeVideo();
  video.src = item.url;
  video.load();
  video.playbackRate = 1;
  video.addEventListener("loadedmetadata",async()=>{
    await loadSavedSession(item.id);
    if(state.lastTime > 0){ try{ video.currentTime = state.lastTime; }catch{} }
    updateProgressUI(video.currentTime,video.duration);
  },{once:true});
}

/* =========================================================
   تحميل الفيديوهات — لا يتم ربطه ببيانات البروفايل أو getCurrentUser
========================================================= */
async function loadVideos(){
  videoList.innerHTML = '<div class="loadingItem">جاري تحميل الدروس...</div>';
  try{
    const {data,error} = await client.from('videos').select('id,title,url,class_group,is_premium').order('id',{ascending:true});
    if(error) throw error;
    state.all = Array.isArray(data) ? data : [];
    render();
    if(!state.all.length){
      videoTitle.textContent = "لا توجد فيديوهات متاحة حاليًا";
      videoSubtitle.textContent = "سيظهر المحتوى هنا عند إضافة الدروس.";
    }
  }catch(error){
    console.error('[Videos]',error);
    videoList.innerHTML = '<div class="emptyItem">❌ تعذر تحميل الدروس حاليًا.</div>';
    toast('تعذر تحميل الدروس حاليًا.');
  }
}

function render(){
  const q = ($("searchInput").value || "").trim().toLowerCase();
  state.filtered = state.all.filter(v => !q || String(v.title || "").toLowerCase().includes(q) || String(v.class_group || "").toLowerCase().includes(q));
  videoCount.textContent = String(state.filtered.length);
  if(!state.filtered.length){ videoList.innerHTML = '<div class="emptyItem">لا توجد دروس مطابقة.</div>'; return; }
  videoList.innerHTML = "";
  state.filtered.forEach(item=>{
    const el = document.createElement("div"); el.className="videoItem"; el.dataset.id=String(item.id); el.tabIndex=0;
    const title=document.createElement("div"); title.className="videoItemTitle"; title.textContent=item.title || "بدون عنوان";
    const meta=document.createElement("div"); meta.className="videoItemMeta"; meta.textContent=item.class_group || "درس";
    el.append(title,meta);
    el.addEventListener("click",()=>selectVideo(item));
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectVideo(item);}});
    videoList.appendChild(el);
  });
}

let rangeStart = 0;
video.addEventListener("play",()=>{ rangeStart = video.currentTime; });
video.addEventListener("pause",()=>{ addWatchedRange(rangeStart,video.currentTime); state.lastTime=video.currentTime; updateProgressUI(video.currentTime,video.duration); saveSession(); });
video.addEventListener("seeked",()=>{ state.lastTime=video.currentTime; updateProgressUI(video.currentTime,video.duration); });
video.addEventListener("timeupdate",()=>{
  if(!video.duration) return;
  addWatchedRange(rangeStart,video.currentTime);
  rangeStart=video.currentTime;
  state.lastTime=video.currentTime;
  updateProgressUI(video.currentTime,video.duration);
});
video.addEventListener("ended",()=>{
  state.completedByEnd = true;
  if(Number.isFinite(video.duration) && video.duration > 0) addWatchedRange(0,video.duration);
  updateProgressUI(video.duration,video.duration);
  saveSession();
  toast("✓ تم إكمال الدرس تلقائيًا");
});
video.addEventListener("ratechange",()=>document.querySelectorAll(".speedBtn").forEach(b=>b.classList.toggle("active",Number(b.dataset.speed)===video.playbackRate)));

document.querySelectorAll(".speedBtn").forEach(btn=>btn.addEventListener("click",()=>{
  const r=Number(btn.dataset.speed);
  if(state.currentVideo?.is_youtube){ try{state.yt?.setPlaybackRate(r);}catch{} }
  else video.playbackRate=r;
  document.querySelectorAll(".speedBtn").forEach(b=>b.classList.toggle("active",b===btn));
}));

qualitySelect.addEventListener("change",()=>{
  if(!state.yt)return;
  const q=qualitySelect.value;
  try{if(q==="auto")state.yt.setPlaybackQuality("default");else state.yt.setPlaybackQuality(q);}catch(e){console.warn(e);}
});

$("searchInput").addEventListener("input",render);
$("mobileMenu").addEventListener("click",()=>sidebar.classList.toggle("open"));
$("logoutBtn").addEventListener("click",async()=>{try{await client.auth.signOut();}catch(e){console.warn(e);}localStorage.removeItem("user");window.location.href="index.html";});

/* =========================================================
   FULLSCREEN — الشاشة الكاملة تشمل العنوان + الفيديو + الشريط السفلي
========================================================= */
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
async function requestPlayerFullscreen(){
  try{
    if(playerCard.requestFullscreen) await playerCard.requestFullscreen();
    else if(playerCard.webkitRequestFullscreen) playerCard.webkitRequestFullscreen();
    else toast("المتصفح لا يدعم ملء الشاشة الكامل.");
  }catch(e){ console.warn("[Fullscreen]",e); toast("تعذر تشغيل ملء الشاشة."); }
}
async function exitFullscreen(){
  try{
    if(document.exitFullscreen) await document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){ console.warn(e); }
}
fullscreenBtn.addEventListener("click",async()=>{
  if(isFullscreen()) await exitFullscreen();
  else await requestPlayerFullscreen();
});

function updateFullscreenButton(){ fullscreenBtn.textContent = isFullscreen() ? "⛶ إغلاق ملء الشاشة" : "⛶ ملء الشاشة"; }

/* إذا فتح المتصفح fullscreen للفيديو نفسه، نعيده فورًا إلى playerCard حتى لا يختفي العنوان والشريط. */
document.addEventListener("fullscreenchange",async()=>{
  updateFullscreenButton();
  const el=document.fullscreenElement;
  if(el && !state.fullscreenRedirecting && (el===video || el===youtubePlayer || el.tagName==="IFRAME")){
    state.fullscreenRedirecting=true;
    try{await exitFullscreen();await requestPlayerFullscreen();}catch(e){console.warn(e);}
    setTimeout(()=>state.fullscreenRedirecting=false,500);
  }
  moveWatermark();
});
document.addEventListener("webkitfullscreenchange",()=>{updateFullscreenButton();moveWatermark();});

/* =========================================================
   حماية المحتوى — أفضل حماية ممكنة من داخل المتصفح
========================================================= */
function showCaptureShield(){
  if(state.captureShieldActive)return;
  state.captureShieldActive=true;
  state.wasPlayingBeforeShield=state.currentVideo?.is_youtube ? true : !video.paused;
  try{ if(state.currentVideo?.is_youtube) state.yt?.pauseVideo?.(); else video.pause(); }catch{}
  antiRecord.classList.add("show");
  captureShield.classList.add("show");
}
function hideCaptureShield(){
  if(!state.captureShieldActive)return;
  state.captureShieldActive=false;
  antiRecord.classList.remove("show");
  captureShield.classList.remove("show");
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden) showCaptureShield();
  else hideCaptureShield();
});
window.addEventListener("blur",()=>{ if(document.hidden) showCaptureShield(); });
window.addEventListener("focus",()=>{ if(!document.hidden) hideCaptureShield(); });
window.addEventListener("keydown",e=>{
  if(e.key === "PrintScreen"){
    showCaptureShield();
    setTimeout(()=>{if(!document.hidden)hideCaptureShield();},1500);
  }
});

window.addEventListener("resize",()=>moveWatermark());
window.addEventListener("beforeunload",()=>{saveSession();});

/* =========================================================
   INIT — الفيديوهات أولاً حتى لا تتأثر بتحميل بيانات الطالب
========================================================= */
(async function init(){
  updateUserUI();
  startWatermark();
  await loadVideos();
  getCurrentUser();
  updateFullscreenButton();
  setInterval(saveSession,30000);
})();
</script>
</body>
</html>
