<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفيديوهات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
overflow-y:auto;
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.video-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
position:relative;
}

.video-item:hover{background:#2563eb;}
.video-item.active{background:#FFD700;color:#111;font-weight:800;}

.lock{
position:absolute;
left:10px;
top:10px;
font-size:14px;
opacity:.7;
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{font-size:22px;font-weight:800;}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.home{background:#2563eb;color:white;}

/* ================= PLAYER ================= */
.player{
background:rgba(255,255,255,.05);
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 20px 40px rgba(0,0,0,.3);
position:relative;
overflow:hidden;
}

video{
width:100%;
border-radius:15px;
}

/* ================= PROGRESS ================= */
.progress{
height:6px;
width:100%;
background:rgba(255,255,255,.1);
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#FFD700;
transition:.3s;
}

/* ================= INFO ================= */
.info{
margin-top:15px;
font-size:16px;
opacity:.9;
}

/* ================= WATERMARK ================= */
#watermark{
position:absolute;
top:20px;
left:20px;
color:white;
font-size:14px;
opacity:0.25;
z-index:999;
pointer-events:none;
background:rgba(0,0,0,0.2);
padding:6px 10px;
border-radius:8px;
transition:0.5s;
}

/* ================= OVERLAY PROTECTION ================= */
#antiRecord{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
color:red;
display:none;
justify-content:center;
align-items:center;
font-size:22px;
z-index:99999;
text-align:center;
padding:20px;
}

/* ================= MOBILE ================= */
@media(max-width:900px){
body{flex-direction:column;}
.sidebar{
width:100%;
display:flex;
overflow-x:auto;
gap:10px;
}
.video-item{min-width:150px;}
}

</style>

</head>

<body>

<div id="antiRecord">
⚠️ تم إيقاف التشغيل مؤقتًا بسبب نشاط غير طبيعي
</div>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">🎬 الفيديوهات</div>

<div id="videoList">تحميل...</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">

<div class="title">📚 محتوى الكورس</div>

<button class="btn home" onclick="window.location.href='dashboard.html'">
🏠 الرجوع
</button>

</div>

<!-- PLAYER -->
<div class="player">

<video id="videoPlayer" controls controlsList="nodownload noplaybackrate">
<source id="videoSource" src="" type="video/mp4">
</video>

<!-- WATERMARK -->
<div id="watermark">Loading...</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="info" id="videoTitle">
اختر فيديو من القائمة
</div>

</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const user = JSON.parse(localStorage.getItem("user")) || {
  name: "Student",
  id: "000"
};

let currentVideoId = null;

/* ================= WATERMARK ================= */
const watermark = document.getElementById("watermark");

function updateWatermark(){
  const time = new Date().toLocaleTimeString();

  watermark.innerText = `${user.name} | ID: ${user.id} | ${time}`;

  const x = Math.random() * 60 + 10;
  const y = Math.random() * 60 + 10;

  watermark.style.left = x + "%";
  watermark.style.top = y + "%";
}

setInterval(updateWatermark, 2500);
updateWatermark();

/* ================= LOAD VIDEOS ================= */
async function loadVideos(){

const { data, error } = await client
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(error){
document.getElementById("videoList").innerHTML = "خطأ في التحميل";
return;
}

const list = document.getElementById("videoList");
list.innerHTML = "";

data.forEach((v,index)=>{

const div = document.createElement("div");
div.className = "video-item";

div.innerHTML = v.is_premium 
? `🎥 ${v.title} <span class="lock">🔒</span>` 
: `🎥 ${v.title}`;

div.onclick = ()=>{

if(v.is_premium && !user?.is_premium){
alert("هذا الفيديو للمشتركين فقط 🔒");
return;
}

playVideo(v.url, v.title, v.id);
setActive(index);

};

list.appendChild(div);

});

}

/* ================= PLAY VIDEO ================= */
function playVideo(url,title,id){

document.getElementById("videoSource").src = url;
document.getElementById("videoPlayer").load();
document.getElementById("videoTitle").innerText = title;

currentVideoId = id;

client.from("student_progress").upsert({
student_id: user.id,
video_id: id,
progress: 0,
updated_at: new Date()
});

}

/* ================= ACTIVE ================= */
function setActive(index){
document.querySelectorAll(".video-item").forEach((el,i)=>{
el.classList.toggle("active", i===index);
});
}

/* ================= PROGRESS ================= */
const video = document.getElementById("videoPlayer");

video.ontimeupdate = async function(){

if(!video.duration) return;

const percent = (video.currentTime / video.duration) * 100;

document.getElementById("progressBar").style.width = percent + "%";

if(currentVideoId){
await client.from("student_progress").upsert({
student_id: user.id,
video_id: currentVideoId,
progress: percent,
updated_at: new Date()
});
}

};

/* ================= SECURITY LAYER ================= */
const overlay = document.getElementById("antiRecord");

function showOverlay(){
overlay.style.display = "flex";
setTimeout(()=>overlay.style.display="none",2500);
}

document.addEventListener("visibilitychange", ()=>{
if(document.hidden) showOverlay();
});

window.addEventListener("blur", showOverlay);

document.addEventListener("contextmenu", e => e.preventDefault());

/* ================= INIT ================= */
loadVideos();

</script>

</body>
</html>
