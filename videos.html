<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفيديوهات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
overflow-y:auto;
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.video-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.video-item:hover{
background:#2563eb;
}

/* MAIN */
.main{
flex:1;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
background:#2563eb;
color:white;
}

/* PLAYER */
.player{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
position:relative;
overflow:hidden;
}

video{
width:100%;
border-radius:15px;
}

/* WATERMARK */
#watermark{
position:absolute;
top:12px;
left:12px;
font-size:12px;
opacity:.25;
white-space:pre-line;
pointer-events:none;
}

/* PROGRESS */
.progress{
height:6px;
background:#333;
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#FFD700;
transition:.2s;
}

/* ANTI RECORD */
#antiRecord{
position:fixed;
inset:0;
display:none;
background:black;
color:red;
justify-content:center;
align-items:center;
z-index:9999;
font-size:20px;
text-align:center;
padding:20px;
}

/* SPEED */
.speedBox{
margin-bottom:10px;
}

.speedBtn{
padding:6px 10px;
margin:2px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
font-weight:700;
}

/* ================= MOBILE RESPONSIVE ================= */

@media (max-width: 900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
height:auto;
border-left:none;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;
flex-direction:column;
padding:15px;
}

.logo{
margin-bottom:15px;
font-size:20px;
}

#videoList{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:10px;
scrollbar-width:none;
}

#videoList::-webkit-scrollbar{
display:none;
}

.video-item{
min-width:180px;
margin-bottom:0;
flex-shrink:0;
text-align:center;
}

.main{
padding:12px;
}

.topbar{
flex-direction:column;
gap:10px;
align-items:stretch;
}

.btn{
width:100%;
}

.speedBox{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:5px;
}

.speedBtn{
flex:1;
min-width:70px;
}

.player{
padding:12px;
border-radius:16px;
}

video{
border-radius:12px;
max-height:60vh;
}

#videoTitle{
font-size:16px;
font-weight:700;
margin-bottom:8px;
}

#percentBox{
font-size:15px;
}

#watermark{
font-size:10px;
top:8px;
left:8px;
max-width:45%;
word-break:break-word;
}

#antiRecord{
font-size:16px;
padding:30px;
}

}

/* موبايلات صغيرة جداً */

@media (max-width:480px){

.logo{
font-size:18px;
}

.video-item{
min-width:150px;
padding:10px;
font-size:14px;
}

.player{
padding:10px;
}

video{
max-height:50vh;
}

#videoTitle{
font-size:15px;
}

#percentBox{
font-size:14px;
}

.speedBtn{
font-size:13px;
padding:8px;
}

}
</style>
</head>

<body>

<div id="antiRecord">⚠️ تم إيقاف العرض بسبب نشاط غير طبيعي</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">🎬 الفيديوهات</div>
<div id="videoList">جاري التحميل...</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>📚 المحتوى</div>
<button class="btn" onclick="window.location.href='dashboard.html'">رجوع</button>
</div>

<!-- SPEED -->
<div class="speedBox">
<button class="speedBtn" onclick="setSpeed(1)">1x</button>
<button class="speedBtn" onclick="setSpeed(1.5)">1.5x</button>
<button class="speedBtn" onclick="setSpeed(2)">2x</button>
</div>

<!-- PLAYER -->
<div class="player">

<video id="videoPlayer" controls controlsList="nodownload"></video>

<div id="watermark"></div>

<div style="margin-top:10px">
<div id="videoTitle">اختر فيديو</div>
<div id="percentBox">0%</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>
</div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= USER ================= */
const savedUser = JSON.parse(localStorage.getItem("user")) || {};

const user = {
  id: savedUser.id || "000",
  name: savedUser.name || "Student",
  email: savedUser.email || "unknown",
  ip: "loading..."
};

fetch("https://api.ipify.org?format=json")
  .then(r => r.json())
  .then(d => user.ip = d.ip);

/* ================= VIDEO ================= */
const video = document.getElementById("videoPlayer");

/* ================= STATE ================= */
let state = {
  currentVideoId: null,
  lastTime: 0,
  sessionSaved: false
};

/* ================= ANALYTICS SESSION ================= */
let session = {
  skips: 0,
  lastTime: 0,
  startTime: Date.now()
};

/* ================= SPEED ================= */
function setSpeed(r){
  video.playbackRate = r;
}

/* ================= WATERMARK ================= */
const watermark = document.getElementById("watermark");

function updateWatermark(){
  const t = new Date().toLocaleTimeString();

  watermark.innerText =
`${user.name}
ID: ${user.id}
Email: ${user.email}
IP: ${user.ip}
${t}`;
}

setInterval(updateWatermark, 2000);
updateWatermark();

/* ================= LOAD VIDEOS ================= */
async function loadVideos(){

  const list = document.getElementById("videoList");
  list.innerHTML = "جاري التحميل...";

  try{

    const { data, error } = await client
      .from("videos")
      .select("*");

    console.log("VIDEOS:", data, error);

    if(error){
      list.innerHTML = "❌ خطأ في قاعدة البيانات";
      return;
    }

    if(!data || data.length === 0){
      list.innerHTML = "📭 لا يوجد فيديوهات";
      return;
    }

    list.innerHTML = "";

    data.forEach(v => {

      const div = document.createElement("div");
      div.className = "video-item";
      div.innerText = v.title;

      div.onclick = () => {

        video.src = v.url;
        video.load();

        state.currentVideoId = v.id;
        state.lastTime = 0;
        state.sessionSaved = false;

        session = {
          skips: 0,
          lastTime: 0,
          startTime: Date.now()
        };

        document.getElementById("videoTitle").innerText = v.title;
      };

      list.appendChild(div);
    });

  }catch(err){
    console.log(err);
    list.innerHTML = "❌ فشل الاتصال";
  }
}

/* ================= PROGRESS + SKIP TRACKING ================= */
video.addEventListener("timeupdate", () => {

  if (!video.duration) return;

  const current = video.currentTime;
  const percent = (current / video.duration) * 100;

  document.getElementById("percentBox").innerText =
    `📊 ${percent.toFixed(1)}%`;

  document.getElementById("progressBar").style.width = percent + "%";

  /* skip detection */
  if (current - session.lastTime > 2) {
    session.skips++;
  }

  session.lastTime = current;
});

/* ================= SAVE FUNCTION (ONCE ONLY) ================= */
async function saveSession(){

  if (state.sessionSaved) return;
  if (!state.currentVideoId || !video.duration) return;

  const percent = (video.currentTime / video.duration) * 100;

  try{

    await client.from("video_sessions").insert([{
      student_id: user.id,
      video_id: state.currentVideoId,
      watched_seconds: Math.floor(video.currentTime),
      duration: Math.floor(video.duration),
      percent: Number(percent.toFixed(2)),
      completed: percent >= 90,
      skips: session.skips,
      updated_at: new Date().toISOString()
    }]);

    state.sessionSaved = true;
    console.log("SESSION SAVED");

  }catch(err){
    console.log("SAVE ERROR:", err);
  }
}

/* ================= TRIGGERS ================= */
video.addEventListener("ended", saveSession);
window.addEventListener("beforeunload", saveSession);

/* ================= ANTI RECORD ================= */
document.addEventListener("visibilitychange",()=>{
  document.getElementById("antiRecord").style.display =
    document.hidden ? "flex" : "none";
});

window.addEventListener("blur",()=>{
  document.getElementById("antiRecord").style.display = "flex";
});

/* ================= INIT ================= */
loadVideos();

</script>
</body>
</html>
