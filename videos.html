<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفيديوهات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
overflow-y:auto;
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.video-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
position:relative;
}

.video-item:hover{background:#2563eb;}

.main{flex:1;padding:20px;}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
background:#2563eb;
color:white;
}

/* PLAYER */
.player{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
position:relative;
overflow:hidden;
}

video{
width:100%;
border-radius:15px;
}

/* WATERMARK */
#watermark{
position:absolute;
top:15px;
left:15px;
font-size:12px;
opacity:.25;
white-space:pre-line;
}

/* PROGRESS */
.progress{
height:6px;
background:#333;
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#FFD700;
transition:.2s;
}

/* ANTI RECORD */
#antiRecord{
position:fixed;
inset:0;
display:none;
background:black;
color:red;
justify-content:center;
align-items:center;
z-index:9999;
font-size:20px;
text-align:center;
padding:20px;
}

/* SPEED */
.speedBox{
margin-bottom:10px;
}

.speedBtn{
padding:6px 10px;
margin:2px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
font-weight:700;
}
</style>
</head>

<body>

<div id="antiRecord">⚠️ تم إيقاف العرض بسبب نشاط غير طبيعي</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">🎬 الفيديوهات</div>
<div id="videoList">Loading...</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div>📚 المحتوى</div>
<button class="btn" onclick="window.location.href='dashboard.html'">رجوع</button>
</div>

<!-- SPEED -->
<div class="speedBox">
<button class="speedBtn" onclick="setSpeed(1)">1x</button>
<button class="speedBtn" onclick="setSpeed(1.5)">1.5x</button>
<button class="speedBtn" onclick="setSpeed(2)">2x</button>
</div>

<!-- PLAYER -->
<div class="player">

<video id="videoPlayer" controls controlsList="nodownload"></video>

<div id="watermark"></div>

<div style="margin-top:10px">
<div id="videoTitle">اختر فيديو</div>
<div id="percentBox">0%</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

/* ================= SUPABASE ================= */
const SUPABASE_URL="https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY="YOUR_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ================= USER ================= */
const savedUser=JSON.parse(localStorage.getItem("user"))||{};

const user={
id:savedUser.id||"000",
name:savedUser.name||"Student",
email:savedUser.email||"unknown",
ip:"loading..."
};

fetch("https://api.ipify.org?format=json")
.then(r=>r.json())
.then(d=>user.ip=d.ip);

/* ================= VIDEO ================= */
const video=document.getElementById("videoPlayer");

/* ================= STATE (ONE SOURCE ONLY) ================= */
let currentVideoId=null;
let watchSeconds=0;
let lastTime=0;
let skips=0;

/* ================= SPEED ================= */
function setSpeed(r){
video.playbackRate=r;
}

/* ================= WATERMARK ================= */
const watermark=document.getElementById("watermark");

function updateWatermark(){
const t=new Date().toLocaleTimeString();

watermark.innerText=
`${user.name}
ID: ${user.id}
Email: ${user.email}
IP: ${user.ip}
${t}`;
}

setInterval(updateWatermark,2000);
updateWatermark();

/* ================= LOAD VIDEOS ================= */
async function loadVideos(){
const {data}=await client.from("videos").select("*");

const list=document.getElementById("videoList");
list.innerHTML="";

data.forEach(v=>{
const div=document.createElement("div");
div.className="video-item";
div.innerText=v.title;

div.onclick=()=>{

document.getElementById("videoTitle").innerText=v.title;
video.src=v.url;
video.load();

currentVideoId=v.id;
watchSeconds=0;
skips=0;
lastTime=0;
};

list.appendChild(div);
});
}

/* ================= ANALYTICS (ONE SYSTEM ONLY) ================= */
setInterval(async ()=>{

if(!video.duration || video.paused) return;

let current=video.currentTime;

if(current-lastTime>2) skips++;

watchSeconds++;
lastTime=current;

let percent=Math.min((current/video.duration)*100,100);

document.getElementById("percentBox").innerText=
"📊 "+percent.toFixed(1)+"%";

document.getElementById("progressBar").style.width=percent+"%";

/* SAVE */
if(currentVideoId){
await client.from("video_analytics").upsert({
student_id:user.id,
video_id:currentVideoId,
watched_seconds:watchSeconds,
percent:percent,
skips:skips,
updated_at:new Date()
});
}

},1000);

/* ================= ANTI RECORD ================= */
document.addEventListener("visibilitychange",()=>{
document.getElementById("antiRecord").style.display=document.hidden?"flex":"none";
});

window.addEventListener("blur",()=>{
document.getElementById("antiRecord").style.display="flex";
});

/* ================= INIT ================= */
loadVideos();

</script>

</body>
</html>
