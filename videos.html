<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفيديوهات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.video-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.video-item:hover{
background:#2563eb;
}

.video-item.active{
background:#FFD700;
color:#111;
font-weight:800;
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:22px;
font-weight:800;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.home{
background:#2563eb;
color:white;
}

/* ================= PLAYER ================= */
.player{
background:rgba(255,255,255,.05);
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 20px 40px rgba(0,0,0,.3);
}

video{
width:100%;
border-radius:15px;
}

/* ================= INFO ================= */
.info{
margin-top:15px;
font-size:16px;
opacity:.9;
}

/* ================= MOBILE ================= */
@media(max-width:900px){
body{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow-x:auto;
gap:10px;
}

.video-item{
min-width:150px;
}
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">🎬 الفيديوهات</div>

<div id="videoList">
تحميل...
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">

<div class="title">📚 محتوى الكورس</div>

<button class="btn home" onclick="window.location.href='dashboard.html'">
🏠 الرجوع
</button>

</div>

<!-- PLAYER -->
<div class="player">

<video id="videoPlayer" controls>
<source id="videoSource" src="" type="video/mp4">
</video>

<div class="info" id="videoTitle">
اختر فيديو من القائمة
</div>

</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9....";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let videos = [];

async function loadVideos(){

const { data, error } = await client
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(error){
document.getElementById("videoList").innerHTML = "خطأ في تحميل الفيديوهات";
return;
}

videos = data;

const list = document.getElementById("videoList");
list.innerHTML = "";

data.forEach((v,index)=>{

const div = document.createElement("div");
div.className = "video-item";
div.innerHTML = "🎥 " + v.title;

div.onclick = ()=>{
playVideo(v.url, v.title);
setActive(index);
};

list.appendChild(div);

});

if(data.length > 0){
playVideo(data[0].url, data[0].title);
setActive(0);
}

}

function playVideo(url,title){

document.getElementById("videoSource").src = url;
document.getElementById("videoPlayer").load();
document.getElementById("videoTitle").innerText = title;

}

function setActive(index){

document.querySelectorAll(".video-item").forEach((el,i)=>{
el.classList.toggle("active", i===index);
});

}

loadVideos();

</script>

</body>
</html>
