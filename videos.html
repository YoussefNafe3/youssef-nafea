<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفيديوهات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
overflow-y:auto;
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.video-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
position:relative;
}

.video-item:hover{background:#2563eb;}
.video-item.active{background:#FFD700;color:#111;font-weight:800;}

.lock{
position:absolute;
left:10px;
top:10px;
font-size:14px;
opacity:.7;
}

/* ================= MAIN ================= */
.main{
flex:1;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{font-size:22px;font-weight:800;}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.home{background:#2563eb;color:white;}

/* ================= PLAYER ================= */
.player{
background:rgba(255,255,255,.05);
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 20px 40px rgba(0,0,0,.3);
position:relative;
overflow:hidden;
}

video{
width:100%;
border-radius:15px;
}

/* ================= WATERMARK ================= */
#watermark{
position:absolute;
top:20px;
left:20px;
color:white;
font-size:13px;
opacity:0.25;
z-index:999999;
pointer-events:none;
background:rgba(0,0,0,0.25);
padding:6px 10px;
border-radius:8px;
white-space:pre-line;
}

/* ================= PROGRESS ================= */
.progress{
height:6px;
width:100%;
background:rgba(255,255,255,.1);
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#FFD700;
transition:.3s;
}

/* ================= INFO ================= */
.info{
margin-top:10px;
font-size:16px;
opacity:.9;
}

/* ================= PERCENT DISPLAY ================= */
.percentBox{
margin-top:10px;
font-size:18px;
font-weight:800;
color:#22c55e;
}

/* ================= OVERLAY ================= */
#antiRecord{
position:fixed;
inset:0;
background:black;
color:red;
display:none;
justify-content:center;
align-items:center;
font-size:22px;
z-index:999999;
text-align:center;
padding:20px;
}

/* ================= SPEED ================= */
.speedBox{
margin-bottom:10px;
}

.speedBtn{
padding:6px 10px;
margin:2px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
font-weight:700;
}

/* ================= MOBILE ================= */
@media(max-width:900px){
body{flex-direction:column;}
.sidebar{
width:100%;
display:flex;
overflow-x:auto;
gap:10px;
}
.video-item{min-width:150px;}
}

</style>
</head>

<body>

<div id="antiRecord">⚠️ تم إيقاف التشغيل بسبب نشاط غير طبيعي</div>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">🎬 الفيديوهات</div>
<div id="videoList">تحميل...</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<div class="title">📚 محتوى الكورس</div>

<button class="btn home" onclick="window.location.href='dashboard.html'">
🏠 الرجوع
</button>
</div>

<!-- SPEED -->
<div class="speedBox">
<button class="speedBtn" onclick="setSpeed(1)">1x</button>
<button class="speedBtn" onclick="setSpeed(1.5)">1.5x</button>
<button class="speedBtn" onclick="setSpeed(2)">2x</button>
</div>

<!-- PLAYER -->
<div class="player">

<video id="videoPlayer" controls controlsList="nodownload noplaybackrate"></video>

<div id="watermark">Loading...</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="info" id="videoTitle">اختر فيديو من القائمة</div>

<div class="percentBox" id="percentBox">0%</div>

</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const savedUser = JSON.parse(localStorage.getItem("user"));

const user = {
  name: savedUser?.name || "Student",
  id: savedUser?.id || "000",
  email: savedUser?.email || "unknown",
  is_premium: savedUser?.is_premium || false,
  ip: "loading..."
};

fetch("https://api.ipify.org?format=json")
  .then(r => r.json())
  .then(d => user.ip = d.ip);

/* ================= VIDEO ================= */
const video = document.getElementById("videoPlayer");

/* ================= SPEED ================= */
function setSpeed(r){
video.playbackRate = r;
}

/* ================= WATERMARK ================= */
const watermark = document.getElementById("watermark");

function updateWatermark(){
const t = new Date().toLocaleTimeString();

watermark.innerText =
`${user.name}
ID: ${user.id}
Email: ${user.email}
IP: ${user.ip}
${t}`;
}

setInterval(updateWatermark, 2000);
updateWatermark();

/* ================= ANALYTICS ================= */
let lastTime = 0;
let watchedSeconds = 0;
let skips = 0;
let currentVideoId = null;

setInterval(async () => {

if(!video.duration || video.paused) return;

let current = video.currentTime;

// detect skip
if(current - lastTime > 2){
skips++;
}

watchedSeconds++;

lastTime = current;

let percent = (watchedSeconds / video.duration) * 100;

if(percent > 100) percent = 100;

document.getElementById("percentBox").innerText =
"📊 Watched: " + percent.toFixed(1) + "%";

/* save to DB */
if(currentVideoId){
await client.from("video_analytics").upsert({
student_id: user.id,
video_id: currentVideoId,
watched_seconds: watchedSeconds,
percent: percent,
skips: skips,
updated_at: new Date()
});
}

}, 1000);

/* ================= LOAD VIDEOS ================= */
async function loadVideos(){

const { data } = await client.from("videos").select("*");

const list = document.getElementById("videoList");
list.innerHTML = "";

data.forEach((v,i)=>{

let div = document.createElement("div");
div.className = "video-item";

div.innerHTML = v.title;

div.onclick = ()=>{

document.getElementById("videoTitle").innerText = v.title;
video.src = v.url;
video.load();

currentVideoId = v.id;

watchedSeconds = 0;
skips = 0;
lastTime = 0;
};

list.appendChild(div);
});

}

/* ================= SECURITY ================= */
document.addEventListener("visibilitychange", ()=>{
if(document.hidden){
document.getElementById("antiRecord").style.display="flex";
}else{
document.getElementById("antiRecord").style.display="none";
}
});

window.addEventListener("blur", ()=>{
document.getElementById("antiRecord").style.display="flex";
});

/* ================= INIT ================= */
loadVideos();

</script>

</body>
</html>
