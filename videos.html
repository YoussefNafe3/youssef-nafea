/* =========================================================
   EXTRACT YOUTUBE ID
========================================================= */

function getYouTubeId(
    url
){

    if(!url){
        return null;
    }


    try{

        const parsed =
        new URL(
            url.trim()
        );


        const hostname =
        parsed.hostname
        .toLowerCase()
        .replace(
            "www.",
            ""
        )
        .replace(
            "m.",
            ""
        );


        /* youtube.com */

        if(
            hostname ===
            "youtube.com"
            ||
            hostname ===
            "youtube-nocookie.com"
        ){

            const watchId =
            parsed.searchParams.get(
                "v"
            );

            if(watchId){

                return watchId;

            }


            const embedMatch =
            parsed.pathname.match(
                /\/embed\/([^/?]+)/
            );

            if(embedMatch){

                return embedMatch[1];

            }


            const shortsMatch =
            parsed.pathname.match(
                /\/shorts\/([^/?]+)/
            );

            if(shortsMatch){

                return shortsMatch[1];

            }

        }


        /* youtu.be */

        if(
            hostname ===
            "youtu.be"
        ){

            const parts =
            parsed.pathname
            .split("/")
            .filter(Boolean);


            if(parts[0]){

                return parts[0];

            }

        }

    }catch(error){

        return null;

    }


    return null;

}

   DETECT VIDEO TYPE

function getVideoType(

){

    return {

    };

}

    /* ================= YOUTUBE ================= */

        "youtube"

        youtubePlayer

        try{

            youtubePlayer.setPlaybackRate(
                speed
            );

        }catch(error){

            console.log(
                "YouTube speed error:",
                error
            );

        }

    }


    /* ================= BUTTON UI ================= */

    document
    .querySelectorAll(
        ".speedBtn"
    )
    .forEach(
        function(button){

            button.classList.toggle(
                "active",
                Number(
                    button.dataset.speed
                ) === speed
            );

        }
    );

}

        const {
            data,
            error
        } =
        await client
        .from("videos")
        .select("*")
        .eq(
            "class_group",
            user.class_group
        )
        .order(
            "id",
            {
                ascending:true
            }
        );


        console.log(
            "VIDEOS:",
            data,
            error
        );


        if(error){

            console.error(
                error
            );

            videoList.innerHTML =
            "❌ خطأ في تحميل الفيديوهات";

            return;

        }


        if(
            !data ||
            data.length === 0
        ){

            videoList.innerHTML =
            "📭 لا توجد فيديوهات متاحة";

            return;

        }


        videoList.innerHTML =
        "";


        data.forEach(
            function(v){

                const item =
                document.createElement(
                    "div"
                );


                item.className =
                "video-item";


                item.dataset.id =
                v.id;


                const videoInfo =
                getVideoType(
                    v.url
                );


                const typeText =
                videoInfo.type ===
                "youtube"
                ?
                "YouTube ▶️"
                :
                "فيديو تعليمي 🎬";


                item.innerHTML = `

                    <div class="video-title">
                        ${escapeHTML(v.title || "فيديو بدون عنوان")}
                    </div>

                    <div class="video-type">
                        ${typeText}
                    </div>

                `;


                item.onclick =
                function(){

                    selectVideo(
                        v,
                        item
                    );

                };


                videoList.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            error
        );

        videoList.innerHTML =
        "❌ فشل الاتصال بقاعدة البيانات";

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    text
){

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    text;

    return div.innerHTML;

}


/* =========================================================
   SELECT VIDEO
========================================================= */

function selectVideo(
    videoData,
    clickedItem
){

    /* ================= RESET ACTIVE ================= */

    document
    .querySelectorAll(
        ".video-item"
    )
    .forEach(
        item =>
        item.classList.remove(
            "active"
        )
    );


    clickedItem.classList.add(
        "active"
    );


    /* ================= RESET STATE ================= */

    state.currentVideoId =
    videoData.id;

    state.lastTime =
    0;

    state.duration =
    0;

    state.sessionSaved =
    false;

    state.restoring =
    true;


    session = {

        skips:
        0,

        lastTime:
        0,

        startTime:
        Date.now()

    };


    videoTitle.innerText =
    videoData.title ||
    "فيديو";


    const info =
    getVideoType(
        videoData.url
    );


    state.currentVideoType =
    info.type;

    state.currentYoutubeId =
    info.youtubeId;


    /* =================================================
       YOUTUBE
    ================================================= */

    if(
        info.type ===
        "youtube"
    ){

        loadYoutubeVideo(
            info.youtubeId
        );

        return;

    }


    /* =================================================
       FILE VIDEO
    ================================================= */

    loadFileVideo(
        videoData.url
    );

}


/* =========================================================
   LOAD FILE VIDEO
========================================================= */

function loadFileVideo(
    url
){

    /* Hide YouTube */

    youtubeFrame.style.display =
    "none";


    /* Show HTML video */

    video.style.display =
    "block";


    emptyPlayer.style.display =
    "none";


    if(youtubePlayer){

        try{

            youtubePlayer.stopVideo();

        }catch(error){}

    }


    video.pause();


    video.src =
    url;


    video.load();


    video.addEventListener(
        "loadedmetadata",
        function(){

            state.duration =
            video.duration || 0;

            restoreFileTime();

        },
        {
            once:true
        }
    );

}


/* =========================================================
   LOAD YOUTUBE
========================================================= */

function loadYoutubeVideo(
    youtubeId
){

    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    video.style.display =
    "none";


    emptyPlayer.style.display =
    "none";


    youtubeFrame.style.display =
    "block";


    if(youtubePlayer){

        try{

            youtubePlayer.loadVideoById(
                youtubeId
            );

        }catch(error){

            console.log(error);

            createYoutubePlayer(
                youtubeId
            );

        }

    }else{

        createYoutubePlayer(
            youtubeId
        );

    }

}


/* =========================================================
   RESTORE FILE TIME
========================================================= */

async function restoreFileTime(){

    if(
        !state.currentVideoId
    ){

        state.restoring =
        false;

        return;

    }


    const saved =
    await getPreviousSession();


    if(
        saved &&
        saved.watched_seconds > 0
    ){

        const maxTime =
        Math.max(
            0,
            (video.duration || 0) - 2
        );


        video.currentTime =
        Math.min(
            Number(
                saved.watched_seconds
            ),
            maxTime
        );


        state.lastTime =
        video.currentTime;

    }


    state.restoring =
    false;

}


/* =========================================================
   RESTORE YOUTUBE TIME
========================================================= */

async function restoreYoutubeTime(){

    if(
        !state.currentVideoId ||
        !youtubePlayer
    ){

        state.restoring =
        false;

        return;

    }


    try{

        const saved =
        await getPreviousSession();


        if(
            saved &&
            saved.watched_seconds > 0
        ){

            youtubePlayer.seekTo(
                Number(
                    saved.watched_seconds
                ),
                true
            );


            state.lastTime =
            Number(
                saved.watched_seconds
            );

        }

    }catch(error){

        console.log(
            "RESTORE YOUTUBE ERROR:",
            error
        );

    }


    state.restoring =
    false;

}


/* =========================================================
   GET PREVIOUS SESSION
========================================================= */

async function getPreviousSession(){

    if(
        !state.currentVideoId
    ){

        return null;

    }


    try{

        const {
            data,
            error
        } =
        await client
        .from(
            "video_sessions"
        )
        .select(
            "watched_seconds,duration,percent,updated_at"
        )
        .eq(
            "student_id",
            String(
                user.id
            )
        )
        .eq(
            "video_id",
            state.currentVideoId
        )
        .order(
            "updated_at",
            {
                ascending:false
            }
        )
        .limit(1);


        if(error){

            console.log(
                "PREVIOUS SESSION ERROR:",
                error
            );

            return null;

        }


        return (
            data &&
            data.length
        )
        ?
        data[0]
        :
        null;

    }catch(error){

        console.log(
            error
        );

        return null;

    }

}


/* =========================================================
   FILE VIDEO TIME UPDATE
========================================================= */

video.addEventListener(
    "timeupdate",
    function(){

        if(
            state.currentVideoType !==
            "file"
        ){

            return;

        }


        if(
            !video.duration
        ){

            return;

        }


        const current =
        video.currentTime;


        const duration =
        video.duration;


        state.duration =
        duration;


        const percent =
        Math.min(
            100,
            (
                current /
                duration
            ) * 100
        );


        updateProgress(
            percent
        );


        detectSkip(
            current
        );

    }
);


/* =========================================================
   YOUTUBE PROGRESS POLLING
========================================================= */

setInterval(
    function(){

        if(
            state.currentVideoType !==
            "youtube"
        ){

            return;

        }


        if(
            !youtubePlayer ||
            typeof youtubePlayer.getCurrentTime !==
            "function"
        ){

            return;

        }


        try{

            const current =
            youtubePlayer.getCurrentTime();


            const duration =
            youtubePlayer.getDuration();


            if(
                !duration ||
                duration <= 0
            ){

                return;

            }


            state.duration =
            duration;


            const percent =
            Math.min(
                100,
                (
                    current /
                    duration
                ) * 100
            );


            updateProgress(
                percent
            );


            detectSkip(
                current
            );


        }catch(error){}

    },
    1000
);


/* =========================================================
   PROGRESS UI
========================================================= */

function updateProgress(
    percent
){

    percentBox.innerText =
    `📊 ${percent.toFixed(1)}%`;


    progressBar.style.width =
    percent + "%";

}


/* =========================================================
   SKIP DETECTION
========================================================= */

function detectSkip(
    current
){

    if(
        state.restoring
    ){

        session.lastTime =
        current;

        return;

    }


    if(
        current -
        session.lastTime >
        3
    ){

        session.skips++;

    }


    session.lastTime =
    current;

}


/* =========================================================
   GET CURRENT TIME
========================================================= */

function getCurrentPlaybackTime(){

    if(
        state.currentVideoType ===
        "file"
    ){

        return video.currentTime || 0;

    }


    if(
        state.currentVideoType ===
        "youtube" &&
        youtubePlayer &&
        typeof youtubePlayer.getCurrentTime ===
        "function"
    ){

        try{

            return (
                youtubePlayer.getCurrentTime() ||
                0
            );

        }catch(error){

            return 0;

        }

    }


    return 0;

}


/* =========================================================
   GET CURRENT DURATION
========================================================= */

function getCurrentDuration(){

    if(
        state.currentVideoType ===
        "file"
    ){

        return video.duration || 0;

    }


    if(
        state.currentVideoType ===
        "youtube" &&
        youtubePlayer &&
        typeof youtubePlayer.getDuration ===
        "function"
    ){

        try{

            return (
                youtubePlayer.getDuration() ||
                0
            );

        }catch(error){

            return 0;

        }

    }


    return 0;

}


/* =========================================================
   SAVE SESSION
========================================================= */

async function saveSession(){

    if(
        !state.currentVideoId
    ){

        return;

    }


    const current =
    getCurrentPlaybackTime();


    const duration =
    getCurrentDuration();


    if(
        !duration ||
        duration <= 0
    ){

        return;

    }


    const percent =
    Math.min(
        100,
        (
            current /
            duration
        ) * 100
    );


    const payload = {

        student_id:
        String(
            user.id
        ),

        video_id:
        state.currentVideoId,

        class_group:
        user.class_group,

        watched_seconds:
        Math.floor(
            current
        ),

        duration:
        Math.floor(
            duration
        ),

        percent:
        Number(
            percent.toFixed(2)
        ),

        completed:
        percent >= 90,

        skips:
        session.skips || 0,

        updated_at:
        new Date()
        .toISOString()

    };


    try{

        /*
          استخدام INSERT متوافق
          مع جدولك الحالي.
        */

        const {
            error
        } =
        await client
        .from(
            "video_sessions"
        )
        .insert(
            [payload]
        );


        if(error){

            console.log(
                "SAVE SESSION ERROR:",
                error
            );

            return;

        }


        state.sessionSaved =
        true;


        console.log(
            "SESSION SAVED:",
            payload
        );


    }catch(error){

        console.log(
            "SAVE SESSION EXCEPTION:",
            error
        );

    }

}


/* =========================================================
   SAVE ON VIDEO END
========================================================= */

video.addEventListener(
    "ended",
    function(){

        saveSession();

    }
);


/* =========================================================
   PERIODIC SAVE
========================================================= */

setInterval(
    function(){

        saveSession();

    },
    30000
);


/* =========================================================
   SAVE BEFORE LEAVE
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        /*
          لا نستخدم await هنا لأن
          المتصفح قد يغلق الصفحة فورًا.
        */

        saveSession();

    }
);


/* =========================================================
   VISIBILITY PROTECTION
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden
        ){

            antiRecord.style.display =
            "flex";

            saveSession();

        }else{

            antiRecord.style.display =
            "none";

        }

    }
);


/* =========================================================
   CONTEXT MENU
========================================================= */

document.addEventListener(
    "contextmenu",
    function(event){

        event.preventDefault();

    }
);


/* =========================================================
   DISABLE SOME SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        /* F12 */

        if(
            event.key ===
            "F12"
        ){

            event.preventDefault();

        }


        /* Ctrl + U */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "u"
        ){

            event.preventDefault();

        }


        /* Ctrl + Shift + I */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() ===
            "i"
        ){

            event.preventDefault();

        }


        /* Ctrl + Shift + J */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() ===
            "j"
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   DISABLE DRAG
========================================================= */

document.addEventListener(
    "dragstart",
    function(event){

        event.preventDefault();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadVideos();


/* =========================================================
   DEFAULT SPEED
========================================================= */

setSpeed(1);

</script>
