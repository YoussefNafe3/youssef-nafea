<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفيديوهات | د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
min-height:100vh;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:280px;
background:#111827;
padding:20px;
border-left:1px solid rgba(255,255,255,.08);
overflow-y:auto;
}

.logo{
font-size:22px;
font-weight:800;
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

.video-item{
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.video-item:hover{background:#2563eb;}

/* MAIN */
.main{flex:1;padding:20px;}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
background:#2563eb;
color:white;
}

/* PLAYER */
.player{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
}

video{
width:100%;
border-radius:15px;
}

.progress-bar{
height:6px;
background:#FFD700;
width:0%;
border-radius:10px;
}

.percentBox{
margin-top:10px;
font-weight:800;
color:#22c55e;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">🎬 الفيديوهات</div>
<div id="videoList">Loading...</div>
</div>

<div class="main">

<div class="topbar">
<div>📚 المحتوى</div>
<button class="btn" onclick="window.location.href='dashboard.html'">رجوع</button>
</div>

<div class="player">

<video id="videoPlayer" controls></video>

<div style="margin-top:10px">
<div id="videoTitle">اختر فيديو</div>

<div style="height:6px;background:#333;border-radius:10px;margin-top:10px;">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="percentBox" id="percentBox">0%</div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= USER ================= */
const savedUser = JSON.parse(localStorage.getItem("user")) || {};

const user = {
  id: savedUser.id || "000",
  name: savedUser.name || "Student"
};

/* ================= STATE ================= */
let currentVideoId = null;
let watchSeconds = 0;
let lastTime = 0;
let skips = 0;

const video = document.getElementById("videoPlayer");

/* ================= LOAD VIDEOS ================= */
async function loadVideos(){

const { data } = await client.from("videos").select("*").order("created_at",{ascending:false});

const list = document.getElementById("videoList");
list.innerHTML = "";

if(!data || data.length === 0){
list.innerHTML = "لا يوجد فيديوهات";
return;
}

data.forEach(v => {

const div = document.createElement("div");
div.className = "video-item";
div.innerText = v.title;

div.onclick = () => {

document.getElementById("videoTitle").innerText = v.title;

video.src = v.url;
video.load();

currentVideoId = v.id;
watchSeconds = 0;
skips = 0;
lastTime = 0;

};

list.appendChild(div);
});

}

/* ================= ANALYTICS (FIXED + CLEAN) ================= */
setInterval(async () => {

if(!video.duration || video.paused || !currentVideoId) return;

let current = video.currentTime;

/* skip detection */
if(current - lastTime > 2){
skips++;
}

watchSeconds++;
lastTime = current;

const percent = Math.min((current / video.duration) * 100, 100);

document.getElementById("percentBox").innerText =
`📊 ${percent.toFixed(1)}%`;

document.getElementById("progressBar").style.width = percent + "%";

/* SAVE ANALYTICS */
await client.from("video_analytics").upsert({
student_id: user.id,
video_id: currentVideoId,
watched_seconds: watchSeconds,
percent: percent,
skips: skips,
updated_at: new Date()
});

}, 1000);

/* ================= SECURITY ================= */
document.addEventListener("visibilitychange", ()=>{
if(document.hidden){
console.log("tab hidden");
}
});

window.addEventListener("blur", ()=>{
console.log("window blurred");
});

/* ================= INIT ================= */
loadVideos();

</script>

</body>
</html>
