<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">

<title>تسجيل الدخول</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#111827,#020617);
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:30px 24px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
text-align:center;
font-size:60px;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:25px;
font-size:28px;
font-weight:800;
}

input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
margin-bottom:15px;
text-align:right;
direction:rtl;
}

input::placeholder{
color:#cbd5e1;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:20px;
user-select:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#FFD700,#ffb300);
color:#111;
font-size:17px;
font-weight:800;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:700;
min-height:24px;
line-height:1.7;
}

.signup-link{
text-align:center;
margin-top:20px;
}

.signup-link a{
color:#FFD700;
text-decoration:none;
font-weight:700;
}

.home-btn{
position:absolute;
top:20px;
right:20px;
padding:10px 14px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);
color:#e5e7eb;
text-decoration:none;
border-radius:12px;
font-size:13px;
font-weight:600;
backdrop-filter:blur(10px);
transition:.3s;
}

.home-btn:hover{
background:#2563eb;
border-color:#2563eb;
transform:translateY(-2px);
}

</style>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>


<body>

<a href="index.html" class="home-btn">
← العودة للصفحة الرئيسية
</a>


<div class="container">

<div class="logo">🧬</div>

<h2>تسجيل الدخول</h2>


<input
id="phone"
type="tel"
inputmode="numeric"
autocomplete="tel"
placeholder="رقم التليفون"
>


<div class="password-box">

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="كلمة المرور"
>

<span
class="eye"
onclick="togglePassword()"
>
👁
</span>

</div>


<button
id="loginBtn"
onclick="login()"
>
دخول
</button>


<div id="msg"></div>


<div class="signup-link">

ليس لديك حساب؟

<a href="signup.html">
إنشاء حساب
</a>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>


<script>

const SUPABASE_URL =
"https://nhdowqzecpwmkunczodl.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";


const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =====================================================
   DEVICE ID
===================================================== */

function getDeviceId(){

let deviceId =
localStorage.getItem("platform_device_id");

if(!deviceId){

deviceId =
"device_" +
crypto.randomUUID();

localStorage.setItem(
"platform_device_id",
deviceId
);

}

return deviceId;

}


/* =====================================================
   SESSION ID
===================================================== */

function createSessionId(){

return crypto.randomUUID();

}


/* =====================================================
   EXISTING LOCAL USER
===================================================== */

const oldUser =
localStorage.getItem("user");

if(oldUser){

try{

const user =
JSON.parse(oldUser);

if(user.role === "admin"){

window.location.replace("admin.html");

}else{

window.location.replace("dashboard.html");

}

}catch(e){

localStorage.removeItem("user");

}

}


/* =====================================================
   LOGIN
===================================================== */

window.login = async function(){

const phone =
document.getElementById("phone")
.value
.trim();

const password =
document.getElementById("password")
.value;

const msg =
document.getElementById("msg");

const btn =
document.getElementById("loginBtn");


if(!phone || !password){

msg.innerText =
"من فضلك أدخل رقم التليفون وكلمة المرور";

return;

}


btn.disabled = true;

msg.innerText =
"جاري تسجيل الدخول...";


try{


/* =====================================================
   1. FIND STUDENT
===================================================== */

const {
data: student,
error: dbError
} = await client
.from("students")
.select("*")
.eq("phone", phone)
.single();


if(dbError || !student){

msg.innerText =
"الرقم غير مسجل";

btn.disabled = false;

return;

}


/* =====================================================
   2. ACTIVATION
===================================================== */

if(!student.activated){

msg.innerText =
"الحساب غير مفعل";

btn.disabled = false;

return;

}


/* =====================================================
   3. SUPABASE AUTH
===================================================== */

const {
data: authData,
error: authError
} = await client.auth.signInWithPassword({

email:
phone + "@phone.com",

password:
password

});


if(authError){

msg.innerText =
"كلمة المرور خطأ";

btn.disabled = false;

return;

}


/* =====================================================
   4. CREATE SESSION
===================================================== */

const sessionId =
createSessionId();

const deviceId =
getDeviceId();


const {
data: sessionResult,
error: sessionError
} = await client.rpc(
"acquire_student_session",
{
p_session_id: sessionId,
p_device_id: deviceId
}
);


if(sessionError){

console.error(sessionError);

await client.auth.signOut();

msg.innerText =
"تعذر إنشاء جلسة الدخول، حاول مرة أخرى";

btn.disabled = false;

return;

}


/* =====================================================
   5. SECOND DEVICE
===================================================== */

if(
!sessionResult ||
!sessionResult.success
){

await client.auth.signOut();


if(
sessionResult?.reason ===
"already_active"
){

msg.innerHTML =
"🔒 <br>هذا الحساب مستخدم حاليًا على جهاز آخر.<br>يرجى تسجيل الخروج من الجهاز السابق أولًا.";

}else{

msg.innerText =
"تعذر تسجيل الدخول حاليًا";

}


btn.disabled = false;

return;

}


/* =====================================================
   6. SAVE LOCAL SESSION
===================================================== */

localStorage.setItem(
"platform_session_id",
sessionId
);


localStorage.setItem(
"platform_device_id",
deviceId
);


localStorage.setItem(
"user",
JSON.stringify({

id:
student.id,

name:
student.full_name,

full_name:
student.full_name,

phone:
student.phone,

email:
phone + "@phone.com",

role:
student.role,

class_group:
student.class_group

})
);


/* =====================================================
   7. REDIRECT
===================================================== */

if(student.role === "admin"){

window.location.replace(
"admin.html"
);

}else{

window.location.replace(
"dashboard.html"
);

}


}catch(err){

console.error(err);

msg.innerText =
"حدث خطأ غير متوقع";

btn.disabled = false;

}

};


/* =====================================================
   PASSWORD
===================================================== */

function togglePassword(){

const pass =
document.getElementById("password");

pass.type =
pass.type === "password"
? "text"
: "password";

}

</script>

</body>
</html>
