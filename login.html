<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<style>
body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
padding-top:60px;
}

input{
display:block;
margin:10px auto;
padding:12px;
width:260px;
border-radius:8px;
border:none;
text-align:right;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#FFD700;
font-weight:bold;
}

#msg{
margin-top:15px;
font-size:14px;
}
</style>
</head>

<body>

<h2>تسجيل الدخول</h2>

<input id="phone" placeholder="رقم التليفون">
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<div id="msg"></div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* ================= INIT ================= */
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= LOGIN ================= */
window.login = async function(){

const phone = document.getElementById("phone").value;
const password = document.getElementById("password").value;
const msg = document.getElementById("msg");

msg.style.color = "white";
msg.innerText = "جاري تسجيل الدخول...";

try{

if(!phone || !password){
msg.style.color = "red";
msg.innerText = "من فضلك املأ البيانات";
return;
}

/* 1. AUTH LOGIN */
const { data, error } = await supabase.auth.signInWithPassword({
email: phone + "@phone.com",
password: password
});

if(error){
msg.style.color = "red";
msg.innerText = error.message;
return;
}

/* 2. GET USER FROM DB */
const { data: student, error: dbError } = await supabase
.from("students")
.select("*")
.eq("phone", phone)
.single();

if(dbError || !student){
msg.style.color = "red";
msg.innerText = "المستخدم غير موجود";
return;
}

/* 3. ACTIVATION CHECK */
if(!student.activated){
msg.style.color = "red";
msg.innerText = "الحساب غير مفعل";
return;
}

/* 4. SAVE SESSION */
localStorage.setItem("user", JSON.stringify(student));

/* 5. REDIRECT BY ROLE */
if(student.role === "admin"){
window.location.href = "admin.html";
}else{
window.location.href = "dashboard.html";
}

}catch(err){
console.log(err);
msg.style.color = "red";
msg.innerText = "حدث خطأ غير متوقع";
}

}
</script>

</body>
</html>
