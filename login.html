<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<div class="logo">🧬</div>
<title>تسجيل الدخول</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#111827,#020617);
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:30px 24px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
text-align:center;
font-size:60px;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:25px;
font-size:28px;
font-weight:800;
}

input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
margin-bottom:15px;
}

input::placeholder{
color:#cbd5e1;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
left:15px;
top:18px;
cursor:pointer;
font-size:20px;
user-select:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#FFD700,#ffb300);
color:#111;
font-size:17px;
font-weight:800;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

#msg{
margin-top:15px;
text-align:center;
font-weight:700;
min-height:24px;
}

.signup-link{
text-align:center;
margin-top:20px;
}

.signup-link a{
color:#FFD700;
text-decoration:none;
font-weight:700;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<h2>تسجيل الدخول</h2>

<input id="phone" placeholder="رقم التليفون">
<div class="password-box">
<input id="password" type="password" placeholder="كلمة المرور">
<span class="eye" onclick="togglePassword()">👁</span>
</div>
<button onclick="login()">دخول</button>

<div id="msg"></div>

<!-- Supabase CDN (ONE ONLY) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZG93cXplY3B3bWt1bmN6b2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDAyNTUsImV4cCI6MjA5NjE3NjI1NX0.Tdfx0e610t059HG1QZVtsqO_UIppi8Axd02fU6jqqTo";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

window.login = async function(){

const phone = document.getElementById("phone").value;
const password = document.getElementById("password").value;
const msg = document.getElementById("msg");

msg.innerText = "جاري تسجيل الدخول...";

try {

// =========================
// 1- تحقق هل الرقم موجود
// =========================
const { data: student, error: dbError } = await client
.from("students")
.select("*")
.eq("phone", phone)
.single();

if(dbError || !student){
msg.innerText = "الرقم غير مسجل، يرجى إنشاء حساب أولاً";
return;
}

// =========================
// 2- محاولة تسجيل الدخول
// =========================
const { data, error } = await client.auth.signInWithPassword({
email: phone + "@phone.com",
password: password
});

// =========================
// 3- لو فشل تسجيل الدخول → غالباً كلمة المرور غلط
// =========================
if(error){
msg.innerText = "خطأ في كلمة المرور";
return;
}

// =========================
// 4- التحقق من التفعيل
// =========================
if(!student.activated){
msg.innerText = "الحساب غير مفعل يرجى انتظار التفعيل";
return;
}

// =========================
// 5- حفظ المستخدم
// =========================
localStorage.setItem("user", JSON.stringify(student));

// =========================
// 6- التوجيه حسب الدور
// =========================
if(student.role === "admin"){
window.location.href = "admin.html";
}else{
window.location.href = "dashboard.html";
}

} catch(err){
console.log(err);
msg.innerText = "حدث خطأ غير متوقع";
}
}
function togglePassword(){
const pass = document.getElementById("password");

if(pass.type === "password"){
pass.type = "text";
}else{
pass.type = "password";
}
}
</script>
</body>
</html>
