<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{
font-family: Arial;
background:#0f0f0f;
color:white;
text-align:center;
padding-top:80px;
}

input{
display:block;
margin:10px auto;
padding:10px;
width:250px;
border-radius:8px;
border:none;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#FFD700;
font-weight:bold;
}

button:hover{
transform:scale(1.05);
}

#msg{
margin-top:15px;
color:#ff4d4d;
}
</style>
</head>

<body>

<h2>تسجيل الدخول</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "PUT_YOUR_ANON_KEY_HERE";

const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const msg = document.getElementById("msg");

msg.style.color = "white";
msg.innerText = "Loading...";

try {

// 1. Auth login
const { data, error } = await supabase.auth.signInWithPassword({
email,
password
});

if(error){
msg.style.color = "red";
msg.innerText = error.message;
return;
}

// 2. get user data from table
const { data: student, error: dbError } = await supabase
.from("students")
.select("*")
.eq("email", email)
.single();

if(dbError || !student){
msg.style.color = "red";
msg.innerText = "User not found in database";
return;
}

// 3. check activation
if(!student.activated){
msg.style.color = "red";
msg.innerText = "Account not activated";
return;
}

// 4. store session
localStorage.setItem("user", JSON.stringify({
email: email,
role: student.role
}));

// 5. redirect based on role
if(student.role === "admin"){
window.location.href = "admin.html";
} else {
window.location.href = "dashboard.html";
}

} catch(err){
msg.style.color = "red";
msg.innerText = "Something went wrong";
console.log(err);
}

}
</script>

</body>
</html>
