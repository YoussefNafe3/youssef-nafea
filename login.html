<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<style>
body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
padding-top:60px;
}

input{
display:block;
margin:10px auto;
padding:12px;
width:250px;
border-radius:8px;
border:none;
text-align:right;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#FFD700;
font-weight:bold;
}

#msg{
margin-top:15px;
}
</style>
</head>

<body>

<h2>تسجيل الدخول</h2>

<input id="phone" placeholder="رقم التليفون">
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const SUPABASE_URL = "https://nhdowqzecpwmkunczodl.supabase.co";
const SUPABASE_ANON_KEY = "PUT_YOUR_ANON_KEY_HERE";

const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){

const phone = document.getElementById("phone").value;
const password = document.getElementById("password").value;
const msg = document.getElementById("msg");

msg.innerText = "جاري الدخول...";

try {

// 1. auth login
const { data, error } = await supabase.auth.signInWithPassword({
email: phone + "@phone.com",
password
});

if(error){
msg.innerText = error.message;
return;
}

// 2. get student
const { data: student } = await supabase
.from("students")
.select("*")
.eq("phone", phone)
.single();

if(!student){
msg.innerText = "المستخدم غير موجود";
return;
}

// 3. activation check
if(!student.activated){
msg.innerText = "الحساب غير مفعل";
return;
}

// 4. save session
localStorage.setItem("user", JSON.stringify(student));

// 5. redirect
if(student.role === "admin"){
window.location.href = "admin.html";
}else{
window.location.href = "dashboard.html";
}

} catch(err){
msg.innerText = "حدث خطأ";
console.log(err);
}

}
</script>

</body>
</html>
