<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د. يوسف نافع</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= ROOT ================= */
:root{
--bg:#f6f8fc;
--card:#ffffff;
--text:#111827;

--gold:#FFD700;
--btn:#FFD700;
--btnText:#111;
--btnShadow:0 8px 25px rgba(255, 215, 0, .35);
}

/* ================= DARK FIX (ONLY FIXED PART) ================= */
.dark{
--bg:#0b1220;
--card:#1e293b;
--text:#ffffff;

--main:#1e293b;
--primary:#ffffff;
--btn:#ff9800;
}

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:var(--bg);
color:var(--text);
transition:.4s ease;
overflow-x:hidden;
background-image:radial-gradient(rgba(15,23,42,.04) 1px, transparent 1px);
background-size:30px 30px;
}

/* ================= TOP BAR ================= */
.top-bar{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 20px;
z-index:9999;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

.logo-small{
color:white;
font-weight:800;
font-size:18px;
}

.auth-buttons{
display:flex;
gap:10px;
}

.nav-btn{
text-decoration:none;
color:white;
padding:8px 16px;
border-radius:20px;
font-size:14px;
background:rgba(255,255,255,0.15);
transition:0.3s;
cursor:pointer;
border:none;
}

.nav-btn:hover{
transform:scale(1.05);
}

.nav-btn.signup{
background:#FFD700;
color:#111;
font-weight:700;
}

/* ================= DARK BUTTON FIX ================= */
#themeToggle{
position:relative;
margin-left:10px;
width:45px;
height:45px;
border-radius:50%;
border:none;
cursor:pointer;
z-index:9999;
background:rgba(255,255,255,0.15);
color:white;
font-size:18px;
}

/* ================= HERO ================= */
.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
position:relative;
padding:30px;

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url('https://images.pexels.com/photos/3825586/pexels-photo-3825586.jpeg?auto=compress&cs=tinysrgb&w=2000');
background-size:cover;
background-position:center;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(0,212,255,.18), transparent 45%),
radial-gradient(circle at 80% 70%, rgba(255,215,0,.12), transparent 45%);
}

.hero-content{
position:relative;
z-index:2;
max-width:900px;
}

.logo{
font-size:65px;
font-weight:900;
color:var(--gold);
margin-bottom:15px;
}

.hero p{
font-size:22px;
margin-bottom:30px;
opacity:.95;
}

.btn{
display:inline-block;
background:var(--btn);
color:var(--btnText);
padding:14px 40px;
border-radius:50px;
font-weight:800;
text-decoration:none;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* باقي التصميم كما هو بدون تغيير */
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">

  <div class="logo-small">🧬</div>

  <div id="authArea" class="auth-area"></div>

  <button id="themeToggle">🌙</button>

</div>

<!-- HERO -->
<section class="hero">
<div class="hero-content">

<div class="logo">🧬 د. يوسف نافع</div>

<p>🎯 احجز مكانك وكن ضمن الطلاب المتفوقين</p>

<a href="#form" class="btn">📩 حجز دفعة 2027</a>

</div>
</section>

<script>

/* ================= DARK MODE FIX ================= */
const toggleBtn = document.getElementById("themeToggle");

toggleBtn.onclick = function(){
document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("theme","dark");
toggleBtn.innerHTML="☀️";
}else{
localStorage.setItem("theme","light");
toggleBtn.innerHTML="🌙";
}
}

if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");
toggleBtn.innerHTML="☀️";
}

/* ================= USER SYSTEM (UNCHANGED LOGIC) ================= */
const user = JSON.parse(localStorage.getItem("user"));
const authArea = document.getElementById("authArea");

if(user){

authArea.innerHTML = `
<div class="nav-btn" onclick="goDashboard()" style="cursor:pointer">
👋 ${user.full_name || user.name || user.phone}
</div>

<button class="nav-btn" onclick="logout()" style="background:#ef4444">
تسجيل خروج
</button>
`;

}else{

authArea.innerHTML = `
<a href="login.html" class="nav-btn">تسجيل الدخول</a>
<a href="signup.html" class="nav-btn signup">إنشاء حساب</a>
`;
}

function goDashboard(){
window.location.href = "dashboard.html";
}

function logout(){
localStorage.removeItem("user");
window.location.href = "index.html";
}

</script>

</body>
</html>
