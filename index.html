<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د. يوسف نافع </title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

/* ================= THEME ================= */
:root{
--bg:#f6f8fc;
--card:#ffffff;
--text:#111827;

--gold:#FFD700;

/* زرار سجل الآن */
--btn:#FFD700;
--btnText:#111;
--btnShadow:0 8px 25px rgba(255, 215, 0, .35);
}

.dark{
--bg:#0b1220;
--card:#1e293b;
--text:#ffffff;

--btn:#ff9800;
--btnText:#111;
--btnShadow:0 8px 20px rgba(255, 152, 0, .25);
}

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:var(--bg);
color:var(--text);
transition:.3s;
overflow-x:hidden;
}

/* ================= THEME BUTTON ================= */
#themeToggle{
position:fixed;
top:18px;
left:18px;
width:55px;
height:55px;
border-radius:50%;
border:none;
cursor:pointer;
z-index:9999;
background:var(--card);
font-size:22px;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

/* ================= HERO ================= */
.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
position:relative;
padding:30px;

/* BIOLOGY BACKGROUND */
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url('https://images.pexels.com/photos/3825586/pexels-photo-3825586.jpeg?auto=compress&cs=tinysrgb&w=2000');
background-size:cover;
background-position:center;
}

/* DNA GLOW EFFECT */
.hero::before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(0,212,255,.18), transparent 45%),
radial-gradient(circle at 80% 70%, rgba(255,215,0,.12), transparent 45%);
}

.hero-content{
position:relative;
z-index:2;
max-width:900px;
}

/* ================= LOGO ================= */
.logo{
font-size:65px;
font-weight:900;
color:var(--gold);
text-shadow:0 5px 20px rgba(0,0,0,.6);
margin-bottom:15px;
}

/* ================= TEXT ================= */
.hero p{
font-size:22px;
margin-bottom:30px;
opacity:.95;
}

/* ================= BUTTON ================= */
.btn{
display:inline-block;
background:var(--btn);
color:var(--btnText);
padding:14px 40px;
border-radius:50px;
font-weight:800;
text-decoration:none;
transition:.3s;

/* 🔥 الظل يرجع ثابت */
box-shadow:0 8px 25px rgba(0,0,0,.20);
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 12px 30px rgba(0,0,0,.25);
}

/* ================= FEATURES ================= */
.section-title{
text-align:center;
font-size:40px;
margin:70px 0 30px;
font-weight:900;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
padding:0 20px 60px;
}

.card{
background:var(--card);
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

/* ================= INFO ================= */
.info{
background:var(--main);
color:white;
padding:70px 20px;
text-align:center;
}

.info span{
color:var(--gold);
font-size:28px;
font-weight:800;
}

/* ================= CONTACT ================= */
.contact{
padding:70px 20px;
text-align:center;
}

.contact a{
display:inline-flex;
align-items:center;
gap:10px;
margin:10px;
padding:14px 28px;
border-radius:50px;
text-decoration:none;
font-weight:700;
color:white;
background:var(--main);
transition:.3s;
}

.contact a:hover{
transform:scale(1.05);
}

/* ================= FORM ================= */
.form{
padding:80px 20px;
}

.form-box{
max-width:1000px;
margin:auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.15);
background:var(--card);
}

iframe{
width:100%;
height:900px;
border:none;
}

/* ================= WHATSAPP ================= */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
text-decoration:none;
z-index:9999;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

/* ================= FOOTER ================= */
footer{
text-align:center;
padding:30px;
background:var(--main);
color:white;
margin-top:40px;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
.logo{font-size:34px;}
.hero p{font-size:18px;}
.section-title{font-size:30px;}
}
.special-btn{
display:inline-block;
margin-top:15px;
background:linear-gradient(135deg,#ff9800,#ff5722);
color:white;
padding:7px 18px;
border-radius:35px;
font-weight:700;
text-decoration:none;
font-size:10px;
transition:.3s;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.special-btn:hover{
transform:scale(1.05);
}
body{
transition: background .4s ease, color .4s ease;
}

#themeToggle{
transition:.3s ease;
}

.dark{
--bg:#0b1220;
--card:#1e293b;
--text:#ffffff;
}

/* smooth global effect */
body{
background:var(--bg);
color:var(--text);
transition:.4s ease;
}  
</style>
</head>

<body>

<!-- THEME -->
<button id="themeToggle" type="button">🌙</button>

<!-- HERO -->

<div class="hero-content">

<div class="logo">🧬 د. يوسف نافع</div>

<p>🎯 احجز مكانك وكن ضمن الطلاب المتفوقين</p>

</a>
</div>

</section>

<!-- FEATURES -->
<h2 class="section-title">🔬 تحجز معانا ليه؟</h2>

<div class="grid">

<div class="card">🧠 شرح مبسط وسهل</div>
<div class="card">📚 مراجعات قوية</div>
<div class="card">🧬تدريب وحل مستمر</div>
<div class="card">⚡ متابعة مستمرة</div>

</div>

<!-- INFO -->
<section class="info">
<span>🔬 الأحياء • العلوم المتكاملة • الجيولوجيا</span>
</section>

<!-- CONTACT -->
<section class="contact">

<h2 class="section-title">📞 تواصل معنا</h2>

<section id="form" class="form">

<!-- WHATSAPP FLOAT -->

<footer>

</footer>

<!-- SCRIPT -->
<script>
function checkCode(){
    let code = prompt("ادخل كود الدخول 👇");

    if(code === "DrNafe3"){
        window.location.href = "physics-surprise.html";
    }else{
        alert("❌ الكود غلط");
    }
}
</script>
<script>
const btn = document.getElementById("themeToggle");

// تحميل الوضع المحفوظ
if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark");
    btn.textContent = "☀️";
}

btn.onclick = function(){

    document.body.classList.toggle("dark");

    let isDark = document.body.classList.contains("dark");

    btn.textContent = isDark ? "☀️" : "🌙";

    localStorage.setItem("theme", isDark ? "dark" : "light");
}
</script>
</body>
</html>
